      const count = state.outfits.length;
      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Start over" tabindex="-1" onclick="if (event.target === this) { closeStartOverModal(); }">
          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full p-8">
            <h2 class="text-2xl font-bold mb-2 text-gray-800 dark:text-gray-100">Start over</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">This permanently removes all ${count} outfit${count === 1 ? '' : 's'} from this browser. It can't be undone. Download a backup first so you can restore later with Import.</p>
            <button onclick="startOverBackup()" class="w-full mb-3 px-6 py-3 border dark:border-gray-600 dark:text-gray-200 font-semibold hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center justify-center gap-2">
              ${state.startOverBackedUp ? 'Backup downloaded — download again' : 'Download backup'}
            </button>
            <div class="flex gap-3 mt-6">
              <button onclick="closeStartOverModal()" class="flex-1 px-6 py-3 border dark:border-gray-600 dark:text-gray-200 ">Cancel</button>
              <button onclick="confirmStartOver()" class="flex-1 px-6 py-3 bg-red-600 text-white font-semibold hover:bg-red-700">Clear all outfits</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderSettingsModal() {
      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Settings" tabindex="-1" onclick="if (event.target === this) { animateModalClose(() => { state.showSettings = false; render(); }); }">
          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto p-8">
            <h2 class="text-2xl font-bold mb-2 text-gray-800 dark:text-gray-100">Gemini API Key</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Get a key from <a href="https://aistudio.google.com/apikey" target="_blank" class="text-blue-600 dark:text-blue-400 underline">aistudio.google.com</a>. Used for everything AI-related here — item detection, "Generate", and Studio Finish — stored only in this browser's localStorage and sent directly to Google.</p>
            <input id="gemini-api-key-input" type="password" value="${state.geminiApiKey}" placeholder="AIza..." class="w-full px-3 py-2 border dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100  mb-6">
            <h2 class="text-2xl font-bold mb-2 text-gray-800 dark:text-gray-100">Auto Studio Finish</h2>
            <label class="flex items-start gap-2.5 mb-6 px-3 py-2.5  border ${state.autoStudioFinish ? 'border-gray-800 dark:border-gray-300 bg-gray-50 dark:bg-gray-700' : 'border-gray-200 dark:border-gray-600'} cursor-pointer">
              <input type="checkbox" ${state.autoStudioFinish ? 'checked' : ''} onchange="toggleAutoStudioFinish()" class="mt-0.5 w-4 h-4 accent-gray-800 dark:accent-gray-300 shrink-0">
              <span class="min-w-0">
                <span class="text-sm font-semibold text-gray-800 dark:text-gray-100">Apply to every upload</span>
                <span class="block text-xs text-gray-500 dark:text-gray-400 mt-0.5">Runs the pose/lighting/background/crop/sharpness cleanup automatically in the background once you confirm an outfit (upload, drag & drop, paste, or URL) - review and adjust the person-box first, then it applies after. Uses one extra Gemini call per photo — off falls back to the original photo as-is.</span>
              </span>
            </label>
            <h2 class="text-2xl font-bold mb-2 text-gray-800 dark:text-gray-100">Crop screen</h2>
            <label class="flex items-start gap-2.5 mb-6 px-3 py-2.5  border ${state.skipBoxAdjust ? 'border-gray-800 dark:border-gray-300 bg-gray-50 dark:bg-gray-700' : 'border-gray-200 dark:border-gray-600'} cursor-pointer">
              <input type="checkbox" ${state.skipBoxAdjust ? 'checked' : ''} onchange="toggleSkipBoxAdjust()" class="mt-0.5 w-4 h-4 accent-gray-800 dark:accent-gray-300 shrink-0">
              <span class="min-w-0">
                <span class="text-sm font-semibold text-gray-800 dark:text-gray-100">Skip the crop screen</span>
                <span class="block text-xs text-gray-500 dark:text-gray-400 mt-0.5">The screen after analyzing where you drag the blue box to set the crop and check the detected items. With this on, the outfit is saved automatically as soon as analyzing finishes. Falls back to showing it if detection fails.</span>
              </span>
            </label>
            <h2 class="text-2xl font-bold mb-2 text-gray-800 dark:text-gray-100">Default AI Instructions</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Sent along with every "Generate" prompt, so Gemini knows what to preserve unless your prompt says otherwise. Leave blank to send no extra instructions.</p>
            <textarea id="style-instructions-input" rows="3" class="w-full px-3 py-2 border dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100  mb-4">${escapeHtml(state.styleInstructions)}</textarea>
            <div class="flex gap-3">
              <button onclick="animateModalClose(() => { state.showSettings = false; render(); })" class="flex-1 px-6 py-3 border dark:border-gray-600 dark:text-gray-200 ">Cancel</button>
              <button onclick="saveApiKey(document.getElementById('gemini-api-key-input').value, document.getElementById('style-instructions-input').value)" class="flex-1 px-6 py-3 bg-blue-600 text-white  font-semibold">Save</button>
            </div>
          </div>
        </div>
      `;
    }

    // Live running-cost badge, pinned to the bottom-right of the viewport. Persisted
    // (see trackGeminiCost/loadCostTotals) rather than session-only, so it keeps
    // accumulating across reloads instead of resetting back to zero every time.
    function formatCost(n) {
      return '$' + n.toFixed(4);
    }

    function renderCostTracker() {
      const d = state.costTotals.detection;
      const s = state.costTotals.studioFinish;
      const g = state.costTotals.generate;
      return `
        <div class="fixed bottom-4 right-4 z-40 flex flex-col gap-1 text-xs text-gray-500 dark:text-gray-400 bg-white/90 dark:bg-gray-800/90 border border-gray-200 dark:border-gray-700 rounded-lg shadow px-3 py-2 pointer-events-none" title="Estimated cost, based on Gemini's published per-token pricing">
          <span>Detection: ${formatCost(d.cost)} (${d.calls})</span>
          <span>Studio Finish: ${formatCost(s.cost)} (${s.calls})</span>
          <span>Generate: ${formatCost(g.cost)} (${g.calls})</span>
        </div>
      `;
    }

    function renderSearchBox() {
      const q = state.searchQuery.trim();
      const showDropdown = state.searchOpen && q.length > 0;

      let chips = [];
      let dropdownVisible = showDropdown;
      if (showDropdown) {
        chips = getSearchChips();
        if (!chips.length && state.outfits.some(outfitMatchesSearch)) {
          // No single piece is named the whole query (e.g. "Black t-shirt
          // White pants" spans two items), but the grid can still have real
          // outfit matches via outfitMatchesSearch's per-item AND. The grid
          // already makes that obvious, so just don't show the dropdown at
          // all here rather than a "No matches" that would be misleading, or
          // any other message competing with the grid for attention.
          dropdownVisible = false;
        }
      }
      const matchingPieces = chips.filter(c => c.action === 'select').map(c => c.piece);
      const siblingChips = chips.filter(c => c.action === 'add');
      // Index within the combined chip list (not the per-section array) - has
      // to match getSearchChips' ordering exactly, since that's what
      // handleSearchKeydown moves state.searchActiveIndex through.
      const chipIndex = piece => chips.findIndex(c => c.piece === piece);
      const activeChipId = state.searchActiveIndex >= 0 && chips[state.searchActiveIndex] ? `search-chip-${state.searchActiveIndex}` : '';

      return `
      <div></div>
        <div class="relative flex-1 min-w-[180px]">
          <div class="relative">
            <input id="search-input" type="text" data-focus-id="search-input" value="${escapeHtml(state.searchQuery)}" oninput="setSearchQuery(this.value)" onkeydown="handleSearchKeydown(event)" onblur="closeSearchDropdown()" placeholder="Search outfits or pieces" role="combobox" aria-expanded="${dropdownVisible}" aria-controls="search-dropdown" ${activeChipId ? `aria-activedescendant="${activeChipId}"` : ''} class="w-full h-10 pl-3 pr-9 text-sm border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 rounded-lg focus:outline-none focus:border-gray-500 dark:focus:border-gray-400">
            ${q ? `
              <button type="button" onclick="clearSearch()" title="Clear search" aria-label="Clear search" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            ` : `
              <svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            `}
          </div>
          ${dropdownVisible ? `
            <div id="search-dropdown" role="listbox" class="absolute left-0 right-0 mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-lg shadow-xl z-50 max-h-96 overflow-y-auto">
              ${!chips.length ? `
                <div class="px-4 py-3 text-sm text-gray-400 dark:text-gray-500">No matches</div>
              ` : `
                ${matchingPieces.length ? `
                  <div class="flex flex-wrap gap-1.5 px-3 py-2">
                    ${matchingPieces.map(piece => `
                      <button id="search-chip-${chipIndex(piece)}" role="option" aria-selected="${chipIndex(piece) === state.searchActiveIndex}" data-active="${chipIndex(piece) === state.searchActiveIndex}" onclick="selectSearchPiece('${piece.name.replace(/'/g, "\\'")}')" class="search-piece-chip">
                        <div class="w-2.5 h-2.5 rounded-full border border-white shadow-sm shrink-0" style="${swatchStyle(piece)}"></div>
                        <span class="truncate">${escapeHtml(piece.name)}</span>
                      </button>
                    `).join('')}
                  </div>
                ` : ''}
                ${siblingChips.length ? `
                  <div class="px-3 pt-2 pb-1 text-[10px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500 ${matchingPieces.length ? 'border-t border-gray-100 dark:border-gray-700 mt-1' : ''}">Also worn with</div>
                  <div class="flex flex-wrap gap-1.5 px-3 pb-2">
                    ${siblingChips.map(({ piece }) => `
                      <button id="search-chip-${chipIndex(piece)}" role="option" aria-selected="${chipIndex(piece) === state.searchActiveIndex}" data-active="${chipIndex(piece) === state.searchActiveIndex}" onclick="addSearchTerm('${piece.name.replace(/'/g, "\\'")}')" class="search-piece-chip">
                        <div class="w-2.5 h-2.5 rounded-full border border-white shadow-sm shrink-0" style="${swatchStyle(piece)}"></div>
                        <span class="truncate">${escapeHtml(piece.name)}</span>
                      </button>
                    `).join('')}
                  </div>
                ` : ''}
              `}
            </div>
          ` : ''}
        </div><div></div>
      `;
    }

    function renderTabBar() {
      const tab = (id, label) => `
        <button data-sl-active="${state.mainTab === id}" onclick="setMainTab('${id}')" class="segmented-opt">${label}</button>
      `;
      return `
        <div class="segmented" data-seg="mainTab">
          <span class="segmented-thumb" aria-hidden="true"></span>
          ${tab('outfits', 'Outfits')}${tab('pieces', 'Pieces')}
        </div>
      `;
    }

    function renderStatusControl() {
      const opt = (id, label) => `
        <button data-sl-active="${state.statusFilter === id}" onclick="setStatusFilter('${id}')" class="segmented-opt">${label}</button>
      `;
      return `
        <div class="segmented" data-seg="statusFilter">
          <span class="segmented-thumb" aria-hidden="true"></span>
          ${opt('owned', 'Owned')}${opt('wanted', 'Wanted')}${opt('all', 'All')}
        </div>
      `;
    }

    // Gallery grid column count - 3 or 4 (only affects lg+ screens).
    function renderColumnsControl() {
      const opt = (n) => `
        <button data-sl-active="${state.outfitCols === n}" onclick="setOutfitCols('${n}')" class="segmented-opt" title="${n} columns">${n}</button>
      `;
      return `
        <div class="segmented" data-seg="outfitCols">
          <span class="segmented-thumb" aria-hidden="true"></span>
          ${opt('3')}${opt('4')}
        </div>
      `;
    }

    // Only meaningful for the Outfits tab - "last added" needs each outfit's own
    // dateAdded, which pieces (aggregated across many outfits) don't have one of.
    function renderSortControl() {
      const opt = (id, label) => `<option value="${id}" ${state.sortBy === id ? 'selected' : ''}>${label}</option>`;
      return `
        <select onchange="setSortBy(this.value)" title="Sort outfits" class="sort-select">
          ${opt('default', 'Sort: More complete')}
          ${opt('recent', 'Sort: Last added')}
        </select>
      `;
    }

    // The Pieces tab's equivalent toolbar dropdown.
    function renderPiecesSortControl() {
      const opt = (id, label) => `<option value="${id}" ${state.piecesSort === id ? 'selected' : ''}>${label}</option>`;
      return `
        <select onchange="setPiecesSort(this.value)" title="Sort pieces" class="sort-select">
          ${opt('newest', 'Sort: Newest')}
          ${opt('mostOutfits', 'Sort: In most outfits')}
        </select>
      `;
    }

    // Most recent time any outfit containing this piece was added - the sort key
    // for the Pieces "Newest" option (pieces have no dateAdded of their own).
    function pieceNewestTime(piece) {
      let max = 0;
      getOutfitsWithPiece(piece.name).forEach(o => {
        const t = Date.parse(o.dateAdded || '') || 0;
        if (t > max) max = t;
      });
      return max;
    }

    // Grid/Table toggle for the Pieces tab - Table is the new alternative view, but
    // it's specifically about what's needed for Wanted outfits, so it only applies
    // there; Owned/All keep the existing grid regardless of this toggle's state.
    function renderPiecesViewToggle() {
      const opt = (id, label) => `
        <button data-sl-active="${state.piecesView === id}" onclick="setPiecesView('${id}')" class="segmented-opt">${label}</button>
      `;
      return `
        <div class="segmented" data-seg="piecesView">
          <span class="segmented-thumb" aria-hidden="true"></span>
          ${opt('grid', 'Grid')}${opt('table', 'Table')}
        </div>
      `;
    }

    // Same Grid/Table toggle, for the Outfits tab.
    function renderOutfitsViewToggle() {
      const opt = (id, label) => `
        <button data-sl-active="${state.outfitsView === id}" onclick="setOutfitsView('${id}')" class="segmented-opt">${label}</button>
      `;
      return `
        <div class="segmented" data-seg="outfitsView">
          <span class="segmented-thumb" aria-hidden="true"></span>
          ${opt('grid', 'Grid')}${opt('table', 'Table')}
        </div>
      `;
    }

    function renderMainView(outfits) {
      // No outfits at all yet - skip the tabs/control chrome, just the upload state.
      if (!state.outfits.length) return renderGalleryView(outfits);

      return `
        <div class="main-toolbar">
          <div class="main-toolbar__start">${renderTabBar()}</div>
          <div class="main-toolbar__center">${renderStatusControl()}</div>
          ${(state.mainTab === 'pieces' || state.outfitsView === 'grid') ? `<div class="main-toolbar__cols">${renderColumnsControl()}</div>` : ''}
        </div>
        ${state.mainTab === 'pieces' ? renderPiecesView() : renderGalleryView(outfits)}
      `;
    }

    // A card-sized link into the grid (see its use in renderGalleryView) for
    // when your own wardrobe search doesn't turn up enough - opens the same
    // query as a Google Images search in a new tab, so you don't have to
    // retype it. Quotes from a chip-built query (see getSearchTerms) carry
    // through into the URL - Google's own search also treats quoted text as
    // an exact phrase, so the "black pants"/"white tshirt" precision you get
    // in-app carries over there too.
    function renderGoogleImageSearchCard(query) {
      // "outfit" appended so results skew toward styled outfit photos rather
      // than random single-product shots - and shown at the bottom of the
      // card so it's clear exactly what will be searched, not just the raw
      // query you typed/built.
      const searchTerm = `${query} outfit`;
      const url = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(searchTerm)}`;
      return `
        <a href="${url}" target="_blank" rel="noopener noreferrer" title="Search Google Images for &quot;${escapeHtml(searchTerm)}&quot;" class="card" data-outfit-id="__search">
          <div class="absolute inset-0 bg-gray-100 dark:bg-gray-900 flex flex-col items-center justify-center gap-2 text-gray-400 dark:text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-800 hover:text-gray-600 dark:hover:text-gray-300 transition-colors p-3">
            <svg class="w-8 h-8 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <span class="text-sm text-center font-medium">Search Google Images</span>
            <span class="text-xs text-center truncate max-w-full">${escapeHtml(searchTerm)}</span>
          </div>
        </a>
      `;
    }

    // True once an outfit's photo has been rescaled and/or panned away from its
    // default framing - the point at which .outfit-photo-soft-edge is worth
    // paying for, since that's when the foreground can actually pull away from
    // the frame and expose .outfit-photo-backdrop underneath.
    function outfitPhotoIsAdjusted(outfit) {
      return Boolean((outfit.imageScale && outfit.imageScale !== 1) || outfit.imageOffsetX || outfit.imageOffsetY);
    }

    function renderOutfitCard(outfit) {
      const completion = getOutfitCompletion(outfit);
      const incomplete = completion.total > 0 && completion.pct < 1;
      const searchActive = state.searchQuery.trim().length > 0;
      const matches = searchActive ? getMatchingItems(outfit) : [];

      const label = searchActive
        ? (matches.length ? `<span title="${escapeHtml(matches.map(i => i.name).join(', '))}">${matches.map(item => `${escapeHtml(item.name)}${item.inRealWardrobe ? '' : ' (missing)'}`).join(' \u00b7 ')}</span>` : '')
        : (incomplete ? `<span title="${escapeHtml(completion.missing.map(i => i.name).join(', '))}">${completion.missing.length === 1 ? 'Missing' : `Missing ${completion.missing.length}`}: ${completion.missing.map(i => escapeHtml(i.name)).join(' \u00b7 ')}</span>` : '');

      return `
        <div class="outfit-cell" data-outfit-id="${outfit.id}">
          <div class="card cursor-pointer group" onclick="openOutfitDetail(${JSON.stringify(outfit).replace(/"/g, '&quot;')})">
            <div class="absolute inset-0 bg-gray-100 dark:bg-gray-900 overflow-hidden">
              <img src="${outfit.imageUrl}" alt="" aria-hidden="true" class="outfit-photo-backdrop">
              <img src="${outfit.imageUrl}" alt="${escapeHtml(outfit.name)}" style="--img-scale: ${outfit.imageScale || 1}; --img-offset-x: ${(outfit.imageOffsetX || 0) * 100}%; --img-offset-y: ${(outfit.imageOffsetY || 0) * 100}%;" class="outfit-photo ${outfit.aiPhoto ? 'outfit-photo-cover' : 'outfit-photo-contain'} ${outfitPhotoIsAdjusted(outfit) ? 'outfit-photo-soft-edge' : ''}">
              <button onclick="deleteOutfit('${outfit.id}', event)" title="Delete this outfit" aria-label="Delete this outfit" class="absolute bottom-2 right-2 bg-red-500 text-white p-2 rounded-full opacity-0 scale-90 group-hover:opacity-100 group-hover:scale-100 transition duration-200 ease-out hover:bg-red-600">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </div>
          ${label ? `<div class="card__caption">${label}</div>` : ''}
        </div>
      `;
    }

    // The three-section missing-items view under Wanted outfits. Always scoped to every
    // Wanted outfit, not just whatever the search box currently narrows the grid to.
    // Hidden for now - flip back to true to bring it back.
    const SHOW_ITEMS_NEEDED = false;

    function renderMissingItemsSummary() {
      const wantedOutfits = state.outfits.filter(o => getOutfitStatus(o) === 'wanted' && getOutfitCompletion(o).missing.length);
      const wantedPieces = getWantedPieces();
      const individual = wantedPieces.filter(p => p.outfitCount === 0);

      if ((!SHOW_ITEMS_NEEDED || !wantedOutfits.length) && !individual.length) return '';

      const pieceChip = (item, extra) => `
        <div class="chip">
          <div class="w-3 h-3 rounded-full border border-white shadow-sm" style="${swatchStyle(item)}"></div>
          <span>${escapeHtml(item.name)}</span>
          ${extra || ''}
        </div>
      `;

      return `
        <div class="mt-10 space-y-8">
          ${SHOW_ITEMS_NEEDED && wantedOutfits.length ? `
            <div>
              <h3 class="text-lg font-bold text-gray-800 dark:text-gray-100 mb-3">Items needed</h3>
              <div class="space-y-4">
                ${wantedOutfits.map(outfit => `
                  <div class="bg-white dark:bg-gray-800 rounded-xl shadow overflow-hidden flex">
                    <img src="${outfit.imageUrl}" alt="${escapeHtml(outfit.name)}" class="w-28 shrink-0 object-cover bg-gray-100 dark:bg-gray-900">
                    <div class="flex-1 min-w-0 p-4">
                      <p class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-2">${escapeHtml(outfit.name)}</p>
                      <div class="divide-y divide-gray-200 dark:divide-gray-700">
                        ${getOutfitCompletion(outfit).missing.map(item => `
                          <div class="flex items-center gap-2 py-2">
                            <div class="w-3 h-3 shrink-0 rounded-full border border-white shadow-sm" style="${swatchStyle(item)}"></div>
                            <span class="text-sm text-gray-700 dark:text-gray-200 truncate">${escapeHtml(item.name)}</span>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          ${individual.length ? `
            <div>
              <h3 class="text-lg font-bold text-gray-800 dark:text-gray-100 mb-3">Individual items</h3>
              <div class="flex flex-wrap gap-2">
                ${individual.map(item => pieceChip(item)).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // Same status-filter + sort logic renderGalleryView uses, factored out so
    // navigateOutfit() (arrow-key navigation in the detail modal) can walk outfits in
    // the exact same order they're actually shown in, instead of a separate ordering.
    function getSortedGalleryOutfits(outfits) {
      const searched = outfits.filter(outfitMatchesSearch);
      const statusOutfits = state.statusFilter === 'all'
        ? searched
        : searched.filter(o => getOutfitStatus(o) === state.statusFilter);
      // Descending completion: fully-owned outfits first, then the closest-to-complete
      // wanted ones, same idea "Wanted" already used, just applied across the mix too.
      // "Last added" overrides that entirely with newest-dateAdded-first, regardless
      // of status tab - array position alone isn't reliable for this since AI-edited
      // siblings get spliced in next to their source rather than appended at the end.
      if (state.sortBy === 'recent') {
        return [...statusOutfits].sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
      }
      return state.statusFilter !== 'owned'
        ? [...statusOutfits].sort((a, b) => getOutfitCompletion(b).pct - getOutfitCompletion(a).pct)
        : statusOutfits;
    }

    function renderGalleryView(outfits) {
      if (!state.outfits.length) {
        return `
          <div class="empty">
            <svg class="w-20 h-20 text-gray-300 dark:text-gray-600 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <p class="text-gray-500 dark:text-gray-400 mb-2 flex items-center justify-center gap-1.5">
              Percha will automatically detect items, colors, and types
              <span aria-hidden="true">✨</span>
            </p>
            <p class="text-xs text-gray-400 dark:text-gray-500 mb-6">You can also drag &amp; drop an image, or paste one with ⌘V / Ctrl+V</p>
            <label class="btn-primary">
              Upload
              <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
            </label>
            <div class="mt-6 flex items-center justify-center gap-3">
              ${['sample1.jpeg', 'sample2.jpg', 'sample3.jpg'].map(s => `
                <button type="button" onclick="useSampleImage('${s}')" title="Try this sample photo" class="w-16 h-20 rounded-lg overflow-hidden border border-gray-200 dark:border-gray-700 hover:border-blue-500 dark:hover:border-blue-400 transition-colors">
                  <img src="${s}" alt="Sample outfit" class="w-full h-full object-cover">
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      const sorted = getSortedGalleryOutfits(outfits);

      if (!sorted.length) {
        const emptySearchQuery = state.searchQuery.trim();
        return `
          <div class="empty">
            <h3 class="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-2">${emptySearchQuery ? 'No matching outfits' : state.statusFilter === 'owned' ? 'No owned outfits yet' : state.statusFilter === 'wanted' ? 'No wanted outfits yet' : 'No outfits yet'}</h3>
            <p class="text-gray-500 dark:text-gray-400 mb-6">${emptySearchQuery ? 'Nothing in your wardrobe matches that search.' : state.statusFilter === 'owned' ? 'An outfit counts as owned once every one of its items is marked owned.' : state.statusFilter === 'wanted' ? 'Any outfit with an item you don\u2019t own yet will show up here.' : 'Add an outfit to get started.'}</p>
            ${emptySearchQuery ? `<div class="max-w-[180px] mx-auto">${renderGoogleImageSearchCard(emptySearchQuery)}</div>` : ''}
          </div>
        `;
      }

      // Table view for Outfits is hidden for now (renderOutfitsTableView is still
      // here, just not reachable) - grid is the only view until it's turned back on.

      const cards = sorted.map(outfit => renderOutfitCard(outfit));
      const searchQuery = state.searchQuery.trim();
      if (searchQuery) {
        // Slotted in as the 4th card - the last spot in the first row on the
        // widest (lg, 4-column) grid layout. Narrower breakpoints will show
        // it somewhere else in the flow instead of strictly "last in row 1",
        // but this app's grid is plain source-order auto-flow (no per-item
        // breakpoint-aware placement elsewhere either), so this is the same
        // level of precision as everything around it.
        cards.splice(Math.min(3, cards.length), 0, renderGoogleImageSearchCard(searchQuery));
      }

      return `
        <div class="main-section__head">
          <h2 class="main-heading">${sorted.length} ${statusFilterPrefix()}${sorted.length === 1 ? 'outfit' : 'outfits'}</h2>
          ${renderSortControl()}
        </div>
        <div class="outfit-grid outfit-grid--${state.outfitCols}">
          ${cards.join('')}
        </div>
        ${state.statusFilter !== 'owned' ? renderMissingItemsSummary() : ''}
      `;
    }

    // Table view for Outfits - same idea as the Pieces table: one row per outfit,
    // photo | name + status, same visual language throughout. Column widths are
    // defined by the .outfits-table-row CSS class (in styles.css), not inline
    // here - edit that one rule to try a different layout.
    function renderOutfitsTableView(sorted) {
      return `
        <div class="main-section__head">
          <h2 class="main-heading">${sorted.length} ${statusFilterPrefix()}${sorted.length === 1 ? 'outfit' : 'outfits'}</h2>
          ${renderSortControl()}
        </div>
        <div class="card">
          ${sorted.map(outfit => `
            <div onclick="openOutfitDetail(${JSON.stringify(outfit).replace(/"/g, '&quot;')})" class="outfits-table-row gap-4 items-start p-4 cursor-pointer border-b border-gray-100 dark:border-gray-700 last:border-0 hover:bg-gray-100 dark:hover:bg-gray-700/50">
              <div class="relative aspect-[3/4] rounded-lg overflow-hidden bg-gray-100 dark:bg-gray-900">
                <img src="${outfit.imageUrl}" style="--img-scale: ${outfit.imageScale || 1}; --img-offset-x: ${(outfit.imageOffsetX || 0) * 100}%; --img-offset-y: ${(outfit.imageOffsetY || 0) * 100}%;" class="outfit-photo w-full h-full object-cover">
              </div>
              <div class="text-sm space-y-1">
                ${outfit.items.map(item => `<div class="${item.inRealWardrobe ? 'text-gray-700 dark:text-gray-200' : 'text-red-600 dark:text-red-400'}">${escapeHtml(item.name)}</div>`).join('')}
              </div>
            </div>
          `).join('')}
        </div>
        ${state.statusFilter !== 'owned' ? renderMissingItemsSummary() : ''}
      `;
    }

    function renderPiecesView() {
      const filtered = getFilteredPieces();
      // Wanted: how many outfits this piece would help complete (missing-from count).
      // Owned/All: every outfit this piece appears in at all - same split the table
      // view uses.
      const outfitsForPiece = (piece) => state.statusFilter === 'wanted'
        ? getOutfitsNeedingPiece(piece.name)
        : getOutfitsWithPiece(piece.name);

      if (!filtered.length) {
        return `
          <div class="empty">
            <h3 class="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-2">${state.statusFilter === 'owned' ? 'No owned pieces yet' : state.statusFilter === 'wanted' ? 'No wanted pieces yet' : 'No pieces yet'}</h3>
            <p class="text-gray-500 dark:text-gray-400">Mark a piece in wardrobe (or not) from any outfit\u2019s detail view to see it here.</p>
          </div>
        `;
      }

      // Grid view for Pieces is hidden for now (the grid markup below is still here,
      // just not reachable) - table is the only view until it's turned back on.
      return renderPiecesTableView(filtered);

      return `
        <div class="main-section__head">
          <h2 class="main-heading">${filtered.length} ${statusFilterPrefix()}${filtered.length === 1 ? 'piece' : 'pieces'}</h2>
        </div>
        <div class="pieces-grid">
          ${filtered.map(piece => {
            const count = outfitsForPiece(piece).length;
            return `
              <div class="card">
                <div class="relative aspect-square bg-gray-100 dark:bg-gray-900" style="${pieceThumbStyle(piece)}">
                
                </div>
                <div class="p-2">
                  <p class="text-base font-semibold text-gray-800 dark:text-gray-100 truncate mb-0.5" title="${escapeHtml(piece.name)}">${escapeHtml(piece.name)}</p>
                  <p class="text-xs text-gray-500 dark:text-gray-400 mb-2">${count} ${count === 1 ? 'outfit' : 'outfits'}</p>

                    <button type="button" data-sl-active="${piece.inRealWardrobe}" aria-pressed="${piece.inRealWardrobe}" onclick="togglePieceFlag('${piece.name.replace(/'/g, "\\'")}', this)" class="status-pill flex-1">
                      <span class="status-pill-dot"></span>
                      In wardrobe
                    </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // The alternative Wanted-pieces view: one row per piece, name on the left, every
    // Wanted outfit that still needs it shown as full photos in the middle (click one
    // to open that outfit), Owned/Wanted at the end.
    // Same piece-sort + per-piece outfit list renderPiecesTableView uses, factored out
    // so navigateOutfit() can walk the table's photos in the exact order they're shown
    // (row by row, left to right within each row), not a separate ordering.
    function getPiecesTableRows(filtered) {
      const isWanted = state.statusFilter === 'wanted';
      const columnLabel = isWanted ? 'Needed for' : 'Appears in';
      const outfitsFor = (piece) => isWanted ? getOutfitsNeedingPiece(piece.name) : getOutfitsWithPiece(piece.name);

      // Base ordering comes from the toolbar dropdown (state.piecesSort); a
      // column-header tap below overrides it.
      const source = isWanted ? getWantedPieces() : filtered;
      const basePieces = state.piecesSort === 'mostOutfits'
        ? [...source].sort((a, b) => outfitsFor(b).length - outfitsFor(a).length)
        : [...source].sort((a, b) => pieceNewestTime(b) - pieceNewestTime(a));

      const dirMul = state.piecesSortDir === 'asc' ? 1 : -1;
      const pieces = state.piecesSortColumn === 'name'
        ? [...basePieces].sort((a, b) => a.name.localeCompare(b.name) * dirMul)
        : state.piecesSortColumn === 'count'
        ? [...basePieces].sort((a, b) => (outfitsFor(a).length - outfitsFor(b).length) * dirMul)
        : basePieces;

      return { pieces, outfitsFor, columnLabel };
    }

    function renderPiecesTableView(filtered) {
      const { pieces, outfitsFor, columnLabel } = getPiecesTableRows(filtered);

      const sortArrow = (column) => state.piecesSortColumn === column
        ? `<span class="ml-1">${state.piecesSortDir === 'asc' ? '\u25b2' : '\u25bc'}</span>`
        : '';
      const sortableTh = (column, label, extraClass) => `
        <th onclick="setPiecesTableSort('${column}')" class="py-4 px-3 text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 cursor-pointer select-none hover:text-gray-800 dark:hover:text-gray-200 ${extraClass || ''}">
          ${label}${sortArrow(column)}
        </th>
      `;

      return `
        <div class="main-section__head">
          <h2 class="main-heading">${pieces.length} ${statusFilterPrefix()}${pieces.length === 1 ? 'piece' : 'pieces'}</h2>
          ${renderPiecesSortControl()}
        </div>
        <div class="card">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-gray-200 dark:border-gray-600">
                ${sortableTh('name', 'Piece')}
                ${sortableTh('count', columnLabel)}
              </tr>
            </thead>
            <tbody>
              ${pieces.map((piece, i) => {
                const outfitsShown = outfitsFor(piece);
                return `
                  <tr class="border-b border-gray-100 dark:border-gray-700 last:border-0">
                    <td class="py-6 px-3 align-top">
                      <div class="flex flex-col gap-1.5 w-36">
                        <span class="text-base font-semibold text-gray-800 dark:text-gray-100">${escapeHtml(piece.name)}</span>
                        <p class="text-xs text-gray-500 dark:text-gray-400">${outfitsShown.length} ${outfitsShown.length === 1 ? 'outfit' : 'outfits'}</p>
                        <div class="flex gap-1.5 mt-4">
                          <button type="button" data-sl-active="${piece.inRealWardrobe}" aria-pressed="${piece.inRealWardrobe}" onclick="togglePieceFlag('${piece.name.replace(/'/g, "\\'")}', this)" class="status-pill">
                            <span class="status-pill-dot"></span>
                            In wardrobe
                          </button>
                        </div>
                      </div>
                    </td>
                    <td class="py-6 px-3 align-middle w-full">
                      <div class="outfit-grid outfit-grid--${state.outfitCols}">
                        ${outfitsShown.map(outfit => `
                          <div class="relative group">
                            <img src="${outfit.imageUrl}" onclick="openOutfitDetail(${JSON.stringify(outfit).replace(/"/g, '&quot;')})" title="${escapeHtml(outfit.name)}" class="w-full aspect-[3/4] object-cover rounded-lg cursor-pointer hover:opacity-80 transition-opacity bg-gray-100 dark:bg-gray-900">
                            <button onclick="deleteOutfit('${outfit.id}', event)" title="Delete this outfit" aria-label="Delete this outfit" class="absolute bottom-2 right-2 bg-red-500 text-white p-2 rounded-full opacity-0 scale-90 group-hover:opacity-100 group-hover:scale-100 transition duration-200 ease-out hover:bg-red-600">
                              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                              </svg>
                            </button>
                          </div>
                        `).join('')}
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // The live-editable person box, drawn directly on the (raw, uncropped) review
    // photo - drag the body to move it, top/bottom edges to resize. Purely a
    // display/editing overlay; the actual padded/framed image only gets computed
    // from this box later, at save time (addOutfit) or when Studio Finish runs -
    // dragging it here never touches currentImage itself. Rendered whenever a
    // personBox exists and Studio Finish hasn't already replaced the photo.
    function renderPersonBoxOverlay() {
      return `
        <div id="person-box" class="absolute border-2 border-blue-500 bg-blue-500/10 cursor-move touch-none" style="left:0%;top:0%;width:100%;height:100%;" onpointerdown="startPersonBoxDrag(event, 'move', document.getElementById('person-box-stage'))">
          <div class="absolute left-0 right-0 -top-2 h-4 cursor-ns-resize" onpointerdown="startPersonBoxDrag(event, 'top', document.getElementById('person-box-stage'))"></div>
          <div class="absolute left-0 right-0 -bottom-2 h-4 cursor-ns-resize" onpointerdown="startPersonBoxDrag(event, 'bottom', document.getElementById('person-box-stage'))"></div>
          <div class="absolute left-1/2 -translate-x-1/2 -top-1 w-10 h-1.5 rounded-full bg-blue-500 pointer-events-none"></div>
          <div class="absolute left-1/2 -translate-x-1/2 -bottom-1 w-10 h-1.5 rounded-full bg-blue-500 pointer-events-none"></div>
        </div>
        <div class="absolute top-2 left-2 text-xs font-medium text-gray-600 dark:text-gray-300 bg-white/90 dark:bg-gray-800/90 px-2.5 py-1.5 rounded-full shadow">
          Drag to adjust - applied when you save
        </div>
        <button onclick="resetPersonBoxToDetected()" title="Reset to Gemini's detected box" class="absolute bottom-3 left-3 px-2.5 py-1.5 text-xs font-medium rounded-full bg-white/90 dark:bg-gray-800/90 shadow hover:bg-white dark:hover:bg-gray-800">
          Reset box
        </button>
      `;
    }

    // Shared "In wardrobe" toggle markup for an item row - identical on both the
    // add-outfit review screen and the saved-outfit detail modal, aside from
    // which function handles the change (toggleDetectedItemFlag vs toggleOwned).
    function renderOwnedToggle(item, i, toggleFnName) {
      return `
        <button type="button" data-sl-active="${item.inRealWardrobe}" aria-pressed="${item.inRealWardrobe}" onclick="${toggleFnName}(${i}, this)" class="status-pill">
          <span class="status-pill-dot"></span>
          In wardrobe
        </button>
      `;
    }

    // Shared "remove this item" button - identical on both the add-outfit
    // review screen and the saved-outfit detail modal, aside from which
    // function handles the click (removeItem vs removeSelectedOutfitItem).
    // Whether it's shown at all is still each call site's own call (the review
    // screen hides it when only one item is left; the modal always shows it).
    function renderRemoveItemButton(i, removeFnName) {
      return `
        <button type="button" onclick="${removeFnName}(${i})" title="Remove this item" aria-label="Remove this item" class="text-gray-400 hover:text-red-600 dark:text-gray-500 dark:hover:text-red-400 shrink-0">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      `;
    }

    // Shared wrapper for an item list (add-outfit review screen and the saved-
    // outfit detail modal both render one) - a single source for the container
    // classes/spacing, so the two lists can't drift apart the way they had
    // (mb-6 vs mb-8) when each screen built its own copy. `rowHtmlFn` renders
    // each row's contents, which otherwise differ enough between the two
    // screens (color picker vs. swatch, item-search results, etc.) that
    // unifying the row markup itself isn't worthwhile. `extraHtml`, when given,
    // renders after the rows but still inside the container - e.g. the review
    // screen's "+ Add Item" button, which the modal has no equivalent of.
    function renderItemList(items, rowHtmlFn, extraHtml = '') {
      return `
        <div class="space-y-4 mb-6 color-row-container">
          ${items.map(rowHtmlFn).join('')}
          ${extraHtml}
        </div>
      `;
    }

    // Shared outer skeleton for the 3 outfit-flow modal states - analyzing,
    // add/review, and outfit detail (incl. its Studio-Finish crossfade). They all
    // render the SAME #add-modal-card / #person-box-stage / #outfit-modal-image /
    // #add-modal-right elements, so morphdom keeps them across the transitions.
    // The image column is a FIXED width so it never resizes; .add-modal-card's
    // max-width transition just reveals more of the (always full-size) right
    // panel, which fades in once the card has finished widening. See styles.css
    // .add-modal-* .
    function renderModalShell({ wide, ariaLabel, closeExpr, animate, imagePane, rightColumn }) {
      // closeExpr closes the modal - fired when the click lands on the dark area
      // OR on the empty space left/right of the card (the wrap), not the card itself.
      const guarded = closeExpr ? `onclick="if (event.target === this) { ${closeExpr} }"` : '';
      return `
        <div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="${ariaLabel}" tabindex="-1" ${guarded}>
          <div class="add-modal-wrap relative w-full flex justify-center" ${guarded}>
            <div id="add-modal-card" class="add-modal-card bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-h-[90vh] w-full ${animate ? 'add-modal-card--animate' : ''}" style="max-width:${wide ? '69rem' : '34rem'}">
              <div class="add-modal-body">
                <div id="person-box-stage" class="add-modal-image relative bg-gray-100 dark:bg-gray-900 aspect-[3/4] flex items-center justify-center overflow-hidden md:sticky md:top-0 md:self-start">
                  ${imagePane}
                </div>
                <div id="add-modal-right" class="add-modal-panel ${wide ? '' : 'add-modal-panel--hidden'}">${rightColumn || ''}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAddView() {
      state.addViewJustEntered = false;
      const analyzing = state.analyzing || state.analyzingFadeOut;

      const imagePane = `
        <img src="${state.currentImage}" alt="" aria-hidden="true" class="outfit-photo-backdrop">
        <img id="outfit-modal-image" src="${state.currentImage}" class="outfit-photo outfit-photo-contain">
        ${!analyzing && state.currentImagePersonBox && !state.skipBoxAdjust ? renderPersonBoxOverlay() : ''}
      `;

      const rightColumn = analyzing ? '' : `
        <div class="mb-6 stagger" style="--stagger-i:0">
          <h2 class="h2 title">${escapeHtml(state.detectedOutfitName) || 'Gemini Detected Items'}</h2>
          ${state.batchTotal > 1 ? `<p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Image ${state.batchIndex} of ${state.batchTotal}</p>` : ''}
        </div>
        ${state.currentImageSource ? `
          <p class="text-sm -mt-4 mb-6">
            <a href="${escapeHtml(state.currentImageSource.url)}" target="_blank" rel="noopener noreferrer" class="text-blue-600 dark:text-blue-400  break-all link_btn">Link</a>
          </p>
        ` : ''}
        ${renderItemList(state.detectedItems, (item, i) => `
            <div class="border dark:border-gray-600 color-row flex gap-3 w-full stagger" style="--stagger-i:${i + 1}">
              <label class="color-swatch-picker" title="Pick color" style="--swatch-color: ${item.color}">
                <span class="color-swatch-dot"></span>
                <input type="color" value="${item.color}" onchange="updateItem(${i}, 'color', this.value)" class="sr-only">
              </label>
              <input type="text" data-focus-id="item-name-${i}" value="${item.name}" oninput="updateItem(${i}, 'name', this.value)" placeholder="e.g., Black jacket" class="flex-1 px-3 py-2  dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 ">
              ${renderOwnedToggle(item, i, 'toggleDetectedItemFlag')}
              ${state.detectedItems.length > 1 ? renderRemoveItemButton(i, 'removeItem') : ''}
            </div>
          `, `<button onclick="addNewItem()" class="w-full px-4 py-2 border-2 border-dashed dark:border-gray-600  hover:border-blue-500 text-gray-600 dark:text-gray-300">+ Add Item</button>`)}
        <div class="flex gap-3 stagger" style="--stagger-i:${state.detectedItems.length + 1}">
          <button onclick="addOutfit()" class="btn-primary flex-1">${state.batchQueue.length ? 'Confirm & Next' : 'Confirm selection'}</button>
          <button onclick="cancelAddOutfit()" class="flex-1 px-6 py-3 border dark:border-gray-600 dark:text-gray-200 ">${state.batchQueue.length ? 'Skip' : 'Cancel'}</button>
        </div>
      `;

      return renderModalShell({
        wide: !analyzing,
        ariaLabel: analyzing ? 'Analyzing outfit' : 'Add outfit',
        closeExpr: 'cancelAddOutfit();',
        animate: true,
        imagePane,
        rightColumn
      });
    }

    function renderDetailModal() {
      // Covers both ways a Studio Finish pass can be in flight: the manual
      // one-click button (state.editing) and the automatic background pass
      // after upload (pendingStudioFinishToken) - Delete/Discard and the
      // Studio Finish button itself are hidden for either.
      const o = state.selectedOutfit;
      const studioFinishInProgress = state.editing || !!o.pendingStudioFinishToken;

      const imagePane = `
        <img src="${o.imageUrl}" alt="" aria-hidden="true" class="outfit-photo-backdrop">
        <img id="outfit-modal-image" src="${state.modalImageFading ? state.modalImagePrev : o.imageUrl}" class="outfit-photo ${(!state.modalImageFading && o.aiPhoto) ? 'outfit-photo-cover' : 'outfit-photo-contain'}">
        ${state.modalImageFading ? `
          <img id="studio-finish-modal-overlay-img" src="${o.imageUrl}" style="opacity:0; transition: opacity 0.6s ease;" class="absolute inset-0 w-full h-full object-cover rounded-lg">
        ` : ''}
      `;

      const rightColumn = `
        <div class="flex justify-between mb-6 stagger" style="--stagger-i:0">
          <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2">
            ${escapeHtml(o.outfitName || o.name.split(',').map(s => s.trim()).filter(Boolean).join(' · '))}
          </h2>
          <button onclick="closeDetailModal();" title="Close" aria-label="Close" class="text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300 text-2xl" hidden>×</button>
        </div>
        ${o.sourceUrl ? `
          <p class="text-sm -mt-4 mb-6">
            <a href="${escapeHtml(o.sourceUrl)}" target="_blank" rel="noopener noreferrer" class="text-blue-600 dark:text-blue-400  break-all link_btn">Link</a>
          </p>
        ` : ''}
        ${renderItemList(o.items, (item, i) => `
          <div class="border dark:border-gray-600 color-row stagger" style="--stagger-i:${i + 1}">
            <div class="flex items-center gap-3">
              <div class="color-swatch" style="${swatchStyle(item)}"></div>
              <input type="text" data-focus-id="detail-item-name-view-${i}" value="${item.name}" oninput="updateSelectedOutfitItem(${i}, 'name', this.value)" placeholder="e.g., Black jacket" title="Rename this item" class="font-semibold flex-1 min-w-0 text-gray-800 dark:text-gray-100 bg-transparent border border-transparent hover:border-gray-300 dark:hover:border-gray-600 focus:border-gray-300 dark:focus:border-gray-600 rounded px-1 -mx-1 focus:outline-none">
              ${renderOwnedToggle(item, i, 'toggleOwned')}
              ${renderRemoveItemButton(i, 'removeSelectedOutfitItem')}
            </div>
            ${item._search && !item._search.loading ? `
              <div class="mt-3 pt-3 border-t dark:border-gray-700 text-sm">
                ${item._search.summary ? `<p class="text-gray-600 dark:text-gray-300 mb-2">${escapeHtmlWithBold(item._search.summary)}</p>` : ''}
                ${item._search.links.length ? `
                  <div class="flex flex-col gap-1.5">
                    ${item._search.links.map(l => `
                      <a href="${escapeHtml(l.uri)}" target="_blank" rel="noopener noreferrer" class="text-xs text-blue-700 dark:text-blue-300 hover:underline break-all">
                        ${escapeHtml(l.uri)}${l.title && l.title !== l.uri ? ` — ${escapeHtml(l.title)}` : ''}
                      </a>
                    `).join('')}
                  </div>
                ` : (item._search.summary ? '' : '<p class="text-gray-400 dark:text-gray-500">No results found.</p>')}
              </div>
            ` : ''}
          </div>
        `)}
        <div class="flex flex-col gap-3 stagger" style="--stagger-i:${o.items.length + 1}">
          ${(!o.aiPhoto && !studioFinishInProgress) ? `
            <button onclick="applyStudioFinish()" title="One click: fix pose/lighting, recrop to 85% frame, clean studio background, remove stray text, sharpen" class="px-3 py-3 border dark:border-gray-600 dark:text-gray-200  font-semibold hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center justify-center gap-2">
              Studio Finish
            </button>
          ` : ''}
          <button onclick="closeDetailModal();" class="btn-primary">Save Outfit</button>
          ${studioFinishInProgress ? '' : o.aiGenerated ? `
            <button onclick="discardOutfitImage()" class="px-3 py-3 border border-red-300 dark:border-red-800 text-red-600 dark:text-red-400 font-semibold hover:bg-red-50 dark:hover:bg-red-900/20">Discard</button>
          ` : `
            <button onclick="deleteOutfit('${o.id}')" class="px-3 py-3 border border-red-300 dark:border-red-800 text-red-600 dark:text-red-400 font-semibold hover:bg-red-50 dark:hover:bg-red-900/20">Delete</button>
          `}
        </div>
      `;

      return renderModalShell({
        wide: true,
        ariaLabel: 'Outfit details',
        closeExpr: 'if (!state.editing) closeDetailModal();',
        animate: state.animateAddFlow,
        imagePane,
        rightColumn
      });
    }

    // Make functions global
    window.handleImageUpload = handleImageUpload;
    window.useSampleImage = useSampleImage;
    window.updateItem = updateItem;
    window.toggleDetectedItemFlag = toggleDetectedItemFlag;
    window.removeItem = removeItem;
    window.addNewItem = addNewItem;
    window.addOutfit = addOutfit;
    window.cancelAddOutfit = cancelAddOutfit;
    window.deleteOutfit = deleteOutfit;
    window.toggleOwned = toggleOwned;
    window.togglePieceFlag = togglePieceFlag;
    window.setMainTab = setMainTab;
    window.goHome = goHome;
    window.setSearchQuery = setSearchQuery;
    window.clearSearch = clearSearch;
    window.handleSearchKeydown = handleSearchKeydown;
    window.addSearchTerm = addSearchTerm;
    window.closeSearchDropdown = closeSearchDropdown;
    window.selectSearchPiece = selectSearchPiece;
    window.setStatusFilter = setStatusFilter;
    window.setSortBy = setSortBy;
    window.setPiecesView = setPiecesView;
    window.setOutfitsView = setOutfitsView;
    window.setOutfitCols = setOutfitCols;
    window.setPiecesTableSort = setPiecesTableSort;
    window.setPiecesSort = setPiecesSort;
    window.updateSelectedOutfitItem = updateSelectedOutfitItem;
    window.removeSelectedOutfitItem = removeSelectedOutfitItem;
    window.searchOutfitImages = searchOutfitImages;
    window.findItemOnline = findItemOnline;
    window.exportData = exportData;
    window.importData = importData;
    window.startOver = startOver;
    window.closeStartOverModal = closeStartOverModal;
    window.startOverBackup = startOverBackup;
    window.confirmStartOver = confirmStartOver;
    window.saveApiKey = saveApiKey;
    window.addFromUrl = addFromUrl;
    window.addGenerateVariant = addGenerateVariant;
    window.removeGenerateVariant = removeGenerateVariant;
    window.selectVariantVersion = selectVariantVersion;
    window.toggleVariantEdit = toggleVariantEdit;
    window.applyVariantEdit = applyVariantEdit;
    window.suggestVariantEditAlternative = suggestVariantEditAlternative;
    window.cancelGenerateModal = cancelGenerateModal;
    window.finalizeGenerateVariants = finalizeGenerateVariants;
    window.openGenerateModal = openGenerateModal;
    window.selectGenerateOption = selectGenerateOption;
    window.selectGenerateColorMode = selectGenerateColorMode;
    window.addCustomColor = addCustomColor;
    window.updateCustomColor = updateCustomColor;
    window.pickCustomColorFromScreen = pickCustomColorFromScreen;
    window.removeCustomColor = removeCustomColor;
    window.hideGenerateModalChrome = hideGenerateModalChrome;
    window.showGenerateModalChrome = showGenerateModalChrome;
    window.randomizeGenerateOptions = randomizeGenerateOptions;
    window.applyStudioFinish = applyStudioFinish;
    window.discardOutfitImage = discardOutfitImage;
    window.closeDetailModal = closeDetailModal;
    window.openOutfitDetail = openOutfitDetail;
    window.animateModalClose = animateModalClose;
    window.applyPreviewScenario = applyPreviewScenario;
    window.togglePreviewPanel = togglePreviewPanel;
    window.state = state;
    window.render = render;
    window.toggleDarkMode = toggleDarkMode;
    window.toggleAutoStudioFinish = toggleAutoStudioFinish;
    window.toggleSkipBoxAdjust = toggleSkipBoxAdjust;
    window.navigateOutfit = navigateOutfit;
    window.resetPersonBoxToDetected = resetPersonBoxToDetected;
    window.startPersonBoxDrag = startPersonBoxDrag;
    window.startImageScaleDrag = startImageScaleDrag;
    window.resetImageScale = resetImageScale;
    window.startImagePanDrag = startImagePanDrag;

    // Outfit thumbnails/photos are plain <img> tags, which browsers let you
    // natively drag by default - an accidental drag (e.g. a click that
    // moved slightly) would otherwise be picked up by handleDrop below just
    // like a real external file drop, silently re-adding/re-detecting a
    // photo that's already in the wardrobe. Blocking dragstart on any <img>
    // here is simpler and more cross-browser-reliable than trying to detect
    // "was this our own image" after the fact in handleDragOver/handleDrop -
    // and nothing in this app relies on native image dragging (its own drag
    // features - pan/rescale/person-box - are pointer-based, not HTML5
    // drag-and-drop).
    document.addEventListener('dragstart', (e) => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

    // Drag & drop anywhere on the page
    document.addEventListener('dragover', handleDragOver);
    document.addEventListener('dragleave', handleDragLeave);
    document.addEventListener('drop', handleDrop);
    document.addEventListener('paste', handlePaste);
    document.getElementById('paste-target').addEventListener('paste', handlePaste);
    window.addEventListener('focus', focusPasteTarget);
    document.addEventListener('click', focusPasteTarget);

    // Left/Right arrow keys step between outfits while the detail modal is open. Ignored
    // while typing in a field (renaming an item, etc.), while an edit is in flight,
    // or while a color-picker/eyedropper popup owns the keyboard.
    document.addEventListener('keydown', (e) => {
      if (!state.selectedOutfit || state.editing) return;
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      navigateOutfit(e.key === 'ArrowLeft' ? -1 : 1);
    });

    // Initialize
    if (PREVIEW_MODE) {
      applyPreviewScenarioFromHash();
      // Back/forward and hand-edited #step= URLs jump straight to that step.
      window.addEventListener('hashchange', applyPreviewScenarioFromHash);
    }
    loadData();
  </script>
</body>
