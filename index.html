    // back to the gallery, skipping the per-image add-outfit review screen.
    async function finalizeGenerateVariants() {
      if (!state.generateVariants.length) return showToast('Generate at least one variant first');
      const images = state.generateVariants.map(v => v.images[v.selectedIndex]);
      // The user already picked a gender when setting up the generation prompt - that's
      // more reliable than re-guessing it from the generated image, so carry it straight
      // through rather than relying on detection (which only fills in the items below).
      const gender = sanitizeGender(state.generateGender);
      resetGenerateModalState();

      state.processing = true;
      render();

      let added = 0;
      for (const dataUrl of images) {
        let items;
        if (state.geminiApiKey) {
          try {
            items = (await detectClothingItems(dataUrl.split(',')[1], 'image/jpeg')).items;
          } catch (err) {
            console.error('AI Error:', err);
            items = [blankDetectedItem()];
          }
        } else {
          items = [blankDetectedItem()];
        }
        const validItems = items.filter(i => i.name && i.name.trim());

        const outfit = {
          id: Date.now().toString() + '-' + added,
          name: validItems.map(i => i.name).join(', ') || 'Generated outfit',
          items: validItems.length ? validItems : items,
          gender,
          imageUrl: dataUrl,
          aiPhoto: true,
          sourceUrl: null,
          sourceTitle: null,
          dateAdded: new Date().toISOString()
        };

        state.outfits.push(outfit);
        if (!(await saveData())) {
          state.outfits.pop();
          showToast('Storage full — export & remove some outfits first');
          break;
        }
        added++;
      }

      state.processing = false;
      state.view = 'gallery';
      if (added) showToast(`${added} outfit${added === 1 ? '' : 's'} added`);
      render();
    }

    // "Studio Finish" - a one-click cleanup pass: no modal, no confirmation step,
    // fires the moment it's clicked, always using STUDIO_FINISH_INSTRUCTION as
    // the whole prompt.
    async function applyStudioFinish() {
      if (!state.geminiApiKey) {
        state.showSettings = true;
        render();
        showToast('Add your Gemini API key in Settings first');
        return;
      }

      const source = state.selectedOutfit;
      const [header, base64] = source.imageUrl.split(',');
      const mimeType = (header.match(/data:(.*);base64/) || [])[1] || 'image/jpeg';
      // Only reuse the stored personBox if this photo is still the untouched
      // original upload it was detected against - once Studio Finish has already
      // run once (aiPhoto true), imageUrl is its recomposed result, and the old
      // fractional coordinates no longer line up with it.
      const personBox = source.aiPhoto ? null : source.personBox;

      state.editing = true;
      render();

      try {
        const compressed = await generateStudioFinishImage(mimeType, base64, personBox, null, getDefaultStudioFinishPrompt(source.items));

        // Cosmetic pass only (pose/lighting/background/crop/sharpness) - the actual
        // garments shouldn't change, so carry the existing tags over rather than
        // spending another AI call re-detecting them.
        const items = source.items.map(item => ({ ...item }));
        const gender = source.gender || 'unisex';

        // Never overwrite the source - save as a sibling outfit, so Studio Finish
        // results show up right next to their source.
        const rootId = source.parentId || source.id;
        const newOutfit = {
          id: Date.now().toString(),
          name: source.name,
          outfitName: source.outfitName || null,
          items,
          gender,
          imageUrl: compressed,
          sourceUrl: source.sourceUrl,
          sourceTitle: source.sourceTitle,
          dateAdded: new Date().toISOString(),
          parentId: rootId,
          aiGenerated: true,
          aiPhoto: true
        };

        let insertAt = state.outfits.findIndex(o => o.id === source.id);
        if (insertAt === -1) insertAt = state.outfits.length - 1;
        while (insertAt + 1 < state.outfits.length && state.outfits[insertAt + 1].parentId === rootId) {
          insertAt++;
        }
        state.outfits.splice(insertAt + 1, 0, newOutfit);

        if (!(await saveData())) {
          state.outfits.splice(insertAt + 1, 1);
          showToast('Storage full — export & remove some outfits first');
        } else {
          state.selectedOutfit = JSON.parse(JSON.stringify(newOutfit));
          showToast('Studio Finish applied');
        }
      } catch (err) {
        console.error('Gemini Studio Finish error:', err);
        showToast('Studio Finish failed: ' + err.message);
      } finally {
        state.editing = false;
        render();
      }
    }

    // Discard an AI-generated sibling outfit (made via Studio Finish) entirely —
    // it's its own outfit, so discarding it is just removing that one entry.
    async function discardOutfitImage() {
      const id = state.selectedOutfit.id;
      state.outfits = state.outfits.filter(o => o.id !== id);
      state.selectedOutfit = null;
      await saveData();
      showToast('Discarded');
      render();
    }

    // Analyze outfit with Gemini
    function blankDetectedItem() {
      return { name: '', type: 'other', color: '#3b82f6', pattern: 'solid', material: 'other', fit: 'regular', inRealWardrobe: false, box: null };
    }

    const VALID_GENDERS = ['men', 'women', 'unisex'];
    function sanitizeGender(gender) {
      return VALID_GENDERS.includes(gender) ? gender : 'unisex';
    }

    const VALID_FITS = ['slim', 'skinny', 'regular', 'loose', 'oversized', 'relaxed', 'other'];
    function sanitizeFit(fit) {
      return VALID_FITS.includes(fit) ? fit : 'other';
    }

    // Gemini sometimes detects the same pair of shoes twice - e.g. once as "shoes" and
    // once as "sneakers" or "boots" for the same item - since detection has no notion
    // of "one pair per foot". Keep only the first footwear item found; drop the rest.
    const FOOTWEAR_TYPES = ['shoes', 'sneakers', 'boots', 'sandals', 'flip-flops', 'espadrilles'];
    function dedupeFootwear(items) {
      let seenFootwear = false;
      return items.filter(item => {
        if (!FOOTWEAR_TYPES.includes(item.type)) return true;
        if (seenFootwear) return false;
        seenFootwear = true;
        return true;
      });
    }

    // Basic color buckets used only for the ownership carry-over below - Gemini's
    // free-text color/name and exact hex both drift slightly between photos of the
    // same physical garment (e.g. "White shirt" one time, "Ivory shirt" the next), so
    // an exact name match alone misses same-piece re-detections too often. Material
    // is deliberately not part of the match - it's a separate, less reliable guess and
    // an item should never be treated as "different" just because Gemini re-guessed
    // its fabric differently across photos.
    const COLOR_FAMILIES = [
      ['black', [20, 20, 20]], ['white', [245, 245, 245]], ['gray', [128, 128, 128]],
      ['red', [210, 30, 30]], ['orange', [235, 130, 30]], ['yellow', [225, 205, 40]],
      ['green', [40, 130, 60]], ['blue', [40, 90, 200]], ['navy', [25, 35, 85]],
      ['purple', [130, 60, 170]], ['pink', [225, 130, 170]], ['brown', [110, 75, 45]],
      ['beige', [215, 195, 165]]
    ];

    function hexToRgb(hex) {
      const m = /^#?([0-9a-f]{6})$/i.exec((hex || '').trim());
      if (!m) return null;
      const n = parseInt(m[1], 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function colorFamily(hex) {
      const rgb = hexToRgb(hex);
      if (!rgb) return null;
      let best = null, bestDist = Infinity;
      for (const [name, ref] of COLOR_FAMILIES) {
        const dist = (rgb[0] - ref[0]) ** 2 + (rgb[1] - ref[1]) ** 2 + (rgb[2] - ref[2]) ** 2;
        if (dist < bestDist) { bestDist = dist; best = name; }
      }
      return best;
    }

    // If a freshly detected item matches a piece already marked "in wardrobe"
    // elsewhere - either by exact name, or by the same item type + rough color family
    // - carry the "owned" flag over. Otherwise every re-upload of an already-owned
    // piece (e.g. the same white shirt in a new outfit photo) shows up unchecked
    // again, just because this photo's detection worded or shaded it slightly differently.
    function applyKnownOwnership(items) {
      const pieces = getAllPieces().filter(p => p.inRealWardrobe);
      return items.map(item => {
        const key = normName(item.name);
        const itemFamily = colorFamily(item.color);
        const known = pieces.find(p =>
          (key && normName(p.name) === key) ||
          (itemFamily && p.type === item.type && colorFamily(p.color) === itemFamily)
        );
        return known ? { ...item, inRealWardrobe: true } : item;
      });
    }

    // Validate an AI-returned bounding box - four finite fractions within [0,1], with
    // some actual area - otherwise treat it as absent (crop falls back to the full image).
    function sanitizeBox(box) {
      if (!box || typeof box !== 'object') return null;
      const { x, y, width, height } = box;
      const nums = [x, y, width, height];
      if (nums.some(n => typeof n !== 'number' || !isFinite(n))) return null;
      if (width <= 0 || height <= 0) return null;
      if (x < 0 || y < 0 || x + width > 1.001 || y + height > 1.001) return null;
      return { x, y, width, height };
    }

    // Ask Gemini to detect clothing items in an image. Returns the item list, or
    // throws on any API/parse failure — callers decide how to fall back.
    async function detectClothingItems(imageBase64, mimeType) {
      const response = await fetch(`${GEMINI_SEARCH_API_URL}?key=${encodeURIComponent(state.geminiApiKey)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { inlineData: { mimeType, data: imageBase64 } },
              {
                text: `Analyze this outfit image and detect ALL individual clothing items visible. Return ONLY a valid JSON object (no markdown, no backticks, no explanation) with this exact format:

{"outfitName":"short name for the outfit as a whole","gender":"men|women|unisex","personBox":{"x":0.0,"y":0.0,"width":0.0,"height":0.0},"items":[{"name":"color + item type","type":"jacket|coat|shirt|t-shirt|sweater|turtleneck|hoodie|pants|shorts|skirt|dress|shoes|sneakers|boots|sandals|flip-flops|espadrilles|hat|belt|accessory|other","color":"#hexcode","pattern":"solid|stripes-h|stripes-v|checkered","material":"cotton|denim|linen|wool|leather|flannel|silk|corduroy|knit|synthetic|other","fit":"slim|skinny|regular|loose|oversized|relaxed|other","inRealWardrobe":false,"box":{"x":0.0,"y":0.0,"width":0.0,"height":0.0}}]}

CRITICAL RULES:
- outfitName: a short, natural name for the outfit as a whole (2-5 words, e.g. "Rainy-day layers", "Weekend denim", "Monochrome office look") - describe the vibe/occasion, not just a list of the items
- gender: your best guess at who this outfit is styled/marketed for, based on the pictured model and the items themselves (not a claim about anyone's identity) - used only to make item search queries more specific (e.g. "men's black jacket")
- personBox: a TIGHT bounding box around the full visible body of the person wearing the outfit - head to feet, including hair and footwear - as fractions (0 to 1) of the full image's width/height, where x/y is the top-left corner. If no person is visible, omit this field entirely.
- Return ONE dominant color per item as hex code (the color field always stays single, even when the name mentions two)
- Use SIMPLE names: "Black jacket" NOT "Black leather bomber jacket"
- Format: "Color + Type" (e.g., "White shirt", "Blue pants", "Black shoes", "Brown belt")
- If an item clearly has two colors in a roughly even split (not just trim/accents), name it "Color and Color + Type" instead (e.g., "Black and white dress", "Red and navy flannel shirt")
- If a t-shirt/shirt/sweater has visible text, letters, or a graphic/logo printed on it, mention that in the name (e.g., "White graphic tee", "Black lettered t-shirt")
- pattern: "stripes-h" for horizontal stripes, "stripes-v" for vertical stripes, "checkered" for check/plaid/gingham, otherwise "solid"
- material: pick the best single match for the fabric/material visible (e.g. a leather jacket, a linen shirt, a flannel shirt, a denim jacket); use "other" if it's not visually identifiable or doesn't fit the list
- fit: how the item sits on the body (e.g. a skinny jean, an oversized hoodie, a slim shirt); use "other" if it's not visually obvious or doesn't apply (e.g. shoes, belts, hats)
- Do not distinguish jeans from other pants — tag all of them as type "pants"
- Distinguish "jacket" from "coat": use "coat" for longer outerwear that falls at or below the hip (overcoats, trench coats, parkas, wool coats); use "jacket" for hip-length-or-shorter outerwear (bombers, denim jackets, blazers, puffer jackets, cardigans worn as an outer layer)
- Use type "turtleneck" (not "sweater") for turtleneck/mock-neck tops
- Do not tag sunglasses or bags as items — skip them entirely
- Detect EVERY other separate item, including small accessories like belts, hats, jewelry, and watches — not just the main top/bottom/shoes
- box: a TIGHT bounding box around just that one item, as fractions (0 to 1) of the full image's width/height, where x/y is the top-left corner — used to crop just that item out of the photo, so keep it as tight as possible around the item's visible edges
- Return ONLY the JSON object, nothing else`
              }
            ]
          }],
          generationConfig: { responseMimeType: 'application/json' }
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message || 'Gemini API error');

      const candidate = data.candidates?.[0];
      if (!candidate) {
        const blockReason = data.promptFeedback?.blockReason;
        throw new Error(blockReason ? `Blocked (${blockReason})` : 'Gemini did not return a result');
      }

      trackGeminiCost('detection', GEMINI_SEARCH_MODEL, data.usageMetadata);

      let textResponse = (candidate.content?.parts || []).map(p => p.text).filter(Boolean).join('');
      textResponse = textResponse.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();

      const parsed = JSON.parse(textResponse);
      const items = applyKnownOwnership(dedupeFootwear((parsed.items || []).map(i => ({
        pattern: 'solid', material: 'other', ...i, fit: sanitizeFit(i.fit), box: sanitizeBox(i.box)
      }))));
      return {
        items: items.length ? items : [blankDetectedItem()],
        gender: sanitizeGender(parsed.gender),
        personBox: sanitizeBox(parsed.personBox),
        outfitName: typeof parsed.outfitName === 'string' ? parsed.outfitName.trim() : ''
      };
    }

    // Detect items for the add-outfit review screen, writing straight into state.
    // Also captures personBox (state.currentImagePersonBox) - used to pre-frame the
    // photo for Studio Finish before it's sent to Gemini for editing.
    async function analyzeOutfitWithAI(imageBase64, mimeType) {
      state.analyzing = true;
      render();

      try {
        const result = await detectClothingItems(imageBase64, mimeType);
        state.detectedItems = result.items;
        state.detectedGender = result.gender;
        state.currentImagePersonBox = result.personBox;
        state.detectedOutfitName = result.outfitName;
      } catch (error) {
        console.error('AI Error:', error);
        state.detectedItems = [blankDetectedItem()];
        state.detectedGender = 'unisex';
        state.currentImagePersonBox = null;
        state.detectedOutfitName = '';
        showToast('AI detection failed - please add items manually');
      } finally {
        // Fade the "analyzing" message out rather than snapping straight to the
        // item list - analyzingFadeOut keeps the message in the DOM for one more
        // render so its opacity transition (driven from render(), see its end)
        // has something to animate, then clears itself once that transition has
        // had time to finish.
        state.analyzing = false;
        state.analyzingFadeOut = true;
        render();

        setTimeout(() => {
          state.analyzingFadeOut = false;
          render();
          // "Skip review screen" setting (cog): as soon as analysis finishes,
          // confirm automatically instead of showing the review/crop screen.
          // Only when detection produced a named item and the user hasn't already
          // dismissed the modal (clicked outside) in the meantime.
          if (state.view === 'add' && state.currentImage && state.skipBoxAdjust
              && state.detectedItems.some(i => i.name && i.name.trim())) {
            addOutfit();
          }
        }, 400);
      }
    }

    // Handle image upload
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (file) processFile(file);
      e.target.value = '';
    }

    // Sample thumbnails on the empty state: load the bundled image and run it
    // through the exact same processFile() path a real upload uses - no mock,
    // real Gemini detection and Studio Finish. fetch() (and canvas readback) are
    // both blocked when the page is opened as a file://, so it needs to be served.
    async function useSampleImage(src) {
      if (location.protocol === 'file:') {
        showToast('Sample images only work when the app is served over http (e.g. `python3 -m http.server`), not opened as a file.');
        return;
      }
      try {
        const res = await fetch(src);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const blob = await res.blob();
        processFile(new File([blob], src.split('/').pop(), { type: blob.type || 'image/jpeg' }));
      } catch (err) {
        console.error('useSampleImage failed:', err);
        showToast('Could not load that sample image — is the local server still running?');
      }
    }

    // Process an image File regardless of source (upload input, drag & drop, URL fetch).
    // `source`, when the image came from a link, is { url, title }.
    async function processFile(file, source = null) {
      if (!file.type || !file.type.startsWith('image/')) {
        showToast('That file is not an image');
        return;
      }

      if (!state.geminiApiKey) {
        state.showSettings = true;
        state.batchQueue = [];
        state.batchTotal = 0;
        state.batchIndex = 0;
        render();
        showToast('Add your Gemini API key to enable AI detection');
        return;
      }

      try {
        const reader = new FileReader();
        reader.onload = async (event) => {
          const rawUrl = event.target.result;

          // No blocking "Processing image..." spinner - drop straight into the
          // analyzing modal showing the raw photo (it slides in like any modal).
          // currentImage is swapped to the resized copy below, before detection
          // actually uses it.
          state.currentImage = rawUrl;
          state.currentImageSource = source;
          state.currentImageToken = null;
          state.currentImagePersonBox = null;
          state.currentImageDetectedBox = null;
          state.currentImageNaturalW = null;
          state.currentImageNaturalH = null;
          state.detectedItems = [];
          state.detectedOutfitName = '';
          state.animateAddFlow = true;
          enterAddView();
          state.analyzing = true;
          render();

          const compressed = await resizeImage(rawUrl);

          // Cheap, local dedupe check before spending a Gemini detection call -
          // see findLikelyDuplicateOutfit. Uses the native confirm() dialog
          // rather than a custom modal, since it needs to block synchronously
          // right here and there's no existing confirm-dialog component to
          // reuse (deleteOutfit doesn't confirm either).
          const duplicate = await findLikelyDuplicateOutfit(compressed);
          if (duplicate && !confirm(`This looks like a photo you've already added ("${duplicate.outfitName || duplicate.name}") — add it anyway?`)) {
            state.analyzing = false;
            advanceQueueOrFinish();
            return;
          }

          state.currentImage = compressed;
          state.currentImageToken = ++studioFinishCounter;

          // Natural size is loaded in parallel - needed for the person-box
          // overlay's letterbox math, not for detection itself. Studio Finish
          // (if enabled) doesn't run yet - see addOutfit, which kicks it off
          // only once the user has confirmed the person-box position, not on upload.
          const base64 = compressed.split(',')[1];
          const [, naturalSize] = await Promise.all([
            analyzeOutfitWithAI(base64, 'image/jpeg'),
            loadImageNaturalSize(compressed)
          ]);
          state.currentImageNaturalW = naturalSize.naturalW;
          state.currentImageNaturalH = naturalSize.naturalH;

          // currentImage stays the raw, untouched upload - no crop is baked in here.
          // The review screen instead shows this box directly on the photo, live-
          // editable (see renderPersonBoxOverlay/startPersonBoxDrag); the actual
          // padded/framed image only gets computed once, at save time (addOutfit)
          // or when Studio Finish runs.
          if (state.currentImagePersonBox) {
            state.currentImageDetectedBox = state.currentImagePersonBox;
          }

          render();
        };
        reader.readAsDataURL(file);
      } catch (err) {
        showToast('Failed to process image');
        state.analyzing = false;
        state.view = 'gallery';
        render();
      }
    }

    // Runs Studio Finish for one just-saved outfit without blocking the UI -
    // kicked off from addOutfit() once the user has confirmed the outfit (and
    // its person-box position), tagged with pendingStudioFinishToken so this
    // can find its way back to the right outfit once it resolves. `token` ties
    // this call to that exact outfit; if it's been deleted by the time this
    // resolves, the result is just dropped.
    async function runBackgroundStudioFinish(originalCompressed, token, personBox, swapGender, basePrompt) {
      try {
        const [header, base64] = originalCompressed.split(',');
        const mimeType = (header.match(/data:(.*);base64/) || [])[1] || 'image/jpeg';
        const extraInstruction = swapGender ? STUDIO_FINISH_SWAP_GENDER_INSTRUCTION : null;
        const finished = await generateStudioFinishImage(mimeType, base64, personBox, extraInstruction, basePrompt);

        const savedOutfit = state.outfits.find(o => o.pendingStudioFinishToken === token);
        if (!savedOutfit) return; // outfit was deleted before this resolved

        const previousUrl = savedOutfit.imageUrl;
        savedOutfit.imageUrl = finished;
        savedOutfit.aiPhoto = true;
        delete savedOutfit.pendingStudioFinishToken;
        // Flip alongside the visual swap, so this stays consistent for
        // anything downstream that reads it (e.g. findItemOnline's "men's"/
        // "women's" search query wording) - only meaningful for men/women,
        // "unisex" has no opposite to flip to.
        if (swapGender) {
          savedOutfit.gender = savedOutfit.gender === 'men' ? 'women' : savedOutfit.gender === 'women' ? 'men' : 'unisex';
        }

        if (!(await saveData())) {
          savedOutfit.imageUrl = previousUrl; // roll back so memory matches storage
          savedOutfit.aiPhoto = false;
          showToast('Studio Finish ready, but storage is full — export & remove some outfits first');
          return;
        }
        if (state.selectedOutfit && state.selectedOutfit.id === savedOutfit.id) {
          // Crossfade the modal's photo from the pre-Studio-Finish original to
          // the new result, rather than just snapping to it - see
          // modalImageFading/modalImagePrev and their use in renderDetailModal.
          state.modalImagePrev = previousUrl;
          state.modalImageFading = true;
          state.selectedOutfit = JSON.parse(JSON.stringify(savedOutfit));
          render();

          // Two rAFs so the browser paints the overlay at opacity 0 first, then
          // transitions it to 1 - setting both in the same tick as insertion
          // would just skip straight to the end state with no visible fade.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            const el = document.getElementById('studio-finish-modal-overlay-img');
            if (el) el.style.opacity = '1';
          }));

          setTimeout(() => {
            state.modalImageFading = false;
            state.modalImagePrev = null;
            render();
          }, 650);
          return;
        }
        render();
      } catch (err) {
        console.error('Background Studio Finish error:', err);
        // That outfit just quietly keeps its original photo - no need to
        // interrupt the user for a background pass they're not watching.
        // Still have to clear the pending marker though, or the "Studio
        // Finish..." badge sticks around forever and (since the button is
        // hidden while a pass is pending - see renderDetailModal) there'd be
        // no way to retry it.
        const failedOutfit = state.outfits.find(o => o.pendingStudioFinishToken === token);
        if (failedOutfit) {
          delete failedOutfit.pendingStudioFinishToken;
          if (state.selectedOutfit && state.selectedOutfit.id === failedOutfit.id) {
            delete state.selectedOutfit.pendingStudioFinishToken;
          }
          saveData();
          render();
        }
      }
    }

    // Start a (possibly multi-file) batch and kick off the first image
    function startBatch(files) {
      if (!files.length) return;
      state.batchQueue = files.slice(1);
      state.batchTotal = files.length;
      state.batchIndex = 1;
      processFile(files[0]);
    }

    // Move on to the next queued image, or return to the gallery if the batch is done
    // `savedOutfit`, when given, is opened in the detail modal once the queue is
    // actually finished (not on every batch step) - so confirming a single
    // outfit lands you on its own page at full size instead of dumping you back
    // into the gallery grid. Ignored mid-batch, where "Confirm & Next" already
    // says the intent is to keep moving, not pause on each result.
    function advanceQueueOrFinish(savedOutfit = null) {
      // Per-draft, not a persisted preference - reset here so it doesn't
      // silently carry over to the next photo (batch or otherwise).
      state.studioFinishSwapGender = false;
      state.studioFinishPromptDraft = '';
      if (state.batchQueue.length) {
        const next = state.batchQueue.shift();
        state.batchIndex += 1;
        processFile(next);
      } else {
        state.view = 'gallery';
        state.currentImage = null;
        state.currentImageSource = null;
        state.currentImageToken = null;
        state.currentImagePersonBox = null;
        state.currentImageDetectedBox = null;
        state.currentImageNaturalW = null;
        state.currentImageNaturalH = null;
        state.detectedItems = [];
        state.detectedGender = 'unisex';
        state.detectedOutfitName = '';
        state.batchTotal = 0;
        state.batchIndex = 0;
        if (savedOutfit) {
          state.selectedOutfit = JSON.parse(JSON.stringify(savedOutfit));
        } else {
          state.animateAddFlow = false; // cancelled out of the flow, no save
        }
        render();
      }
    }

    // Cancel the current image in the batch and move to the next one (or finish)
    function cancelAddOutfit() {
      animateModalClose(() => advanceQueueOrFinish());
    }

    // Pull every candidate image URL out of a parsed page (og:image, twitter:image,
    // <img src>, <img srcset>), resolved to absolute URLs against the page's own URL.
    function extractCandidateImageUrls(doc, pageUrl) {
      const candidates = new Set();

      doc.querySelectorAll('meta[property="og:image"], meta[property="og:image:secure_url"], meta[name="twitter:image"]').forEach(meta => {
        const content = meta.getAttribute('content');
        if (content) candidates.add(content);
      });

      doc.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src') || img.getAttribute('data-src');
        if (src) candidates.add(src);

        const srcset = img.getAttribute('srcset') || img.getAttribute('data-srcset');
        if (srcset) {
          srcset.split(',').forEach(part => {
            const candidateUrl = part.trim().split(/\s+/)[0];
            if (candidateUrl) candidates.add(candidateUrl);
          });
        }
      });

      return [...candidates]
        .map(u => { try { return new URL(u, pageUrl).href; } catch { return null; } })
        .filter(Boolean);
    }

    // Load each candidate image just far enough to read its real pixel dimensions,
    // and return whichever has the largest area (width x height).
    function pickLargestImage(urls) {
      return new Promise((resolve) => {
        if (!urls.length) return resolve(null);
        let remaining = urls.length;
        let best = null;

        urls.forEach(url => {
          const img = new Image();
          const settle = (area) => {
            if (area > 0 && (!best || area > best.area)) best = { url, area };
            if (--remaining === 0) resolve(best ? best.url : urls[0]);
          };
          img.onload = () => settle(img.naturalWidth * img.naturalHeight);
          img.onerror = () => settle(0);
          img.src = url;
        });
      });
    }

    // This app has no backend, so cross-origin fetches to sites that don't send
    // Access-Control-Allow-Origin get blocked by the browser (most sites — CORS is
    // opt-in). Try a direct fetch first, then fall back to images.weserv.nl, a
    // public read-only image proxy that adds CORS headers, so pasting/adding a
    // direct image link from a site that blocks cross-origin fetches still works.
    const IMAGE_PROXY_URL = 'https://images.weserv.nl/?url=';

    async function fetchWithCorsFallback(url) {
      try {
        return await fetch(url);
      } catch (err) {
        const bareUrl = url.replace(/^https?:\/\//, '');
        const res = await fetch(IMAGE_PROXY_URL + encodeURIComponent(bareUrl));
        if (!res.ok) throw err;
        return res;
      }
    }

    // Given any URL, resolve it to { imageUrl, title }: itself (no title) if it's
    // already a direct image, otherwise the largest image found on that page plus
    // the page's <title>.
    async function resolveImageUrl(url) {
      const res = await fetchWithCorsFallback(url);
      if (!res.ok) throw new Error('Request failed');

      const contentType = res.headers.get('content-type') || '';
      if (contentType.startsWith('image/')) return { imageUrl: url, title: null };

      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const title = (doc.querySelector('title')?.textContent || '').trim() || null;

      const candidates = extractCandidateImageUrls(doc, url);
      const largest = await pickLargestImage(candidates);
      if (!largest) throw new Error('No image found on that page');
      return { imageUrl: largest, title };
    }

    // Add an image from a URL (a direct image link, or a webpage - the biggest image on it is used).
    // Remembers the original link (and page title, if any) so it can be shown later.
    async function addFromUrl(url) {
      url = (url || '').trim();
      if (!url) return showToast('Enter an image URL');

      state.showUrlModal = false;
      state.processing = true;
      render();

      try {
        const { imageUrl, title } = await resolveImageUrl(url);
        const res = await fetchWithCorsFallback(imageUrl);
        if (!res.ok) throw new Error('Request failed');
        const blob = await res.blob();
        if (!blob.type.startsWith('image/')) throw new Error('Not an image');

        const filename = imageUrl.split('/').pop().split('?')[0] || 'image.jpg';
        const file = new File([blob], filename, { type: blob.type });
        state.processing = false;
        await processFile(file, { url, title });
      } catch (err) {
        console.error('URL fetch error:', err);
        state.processing = false;
        showToast('Could not load an image from that URL (check the link, or CORS may be blocking it)');
        render();
      }
    }

    // True if a pasted/typed string looks like an http(s) URL
    function isLikelyUrl(text) {
      try {
        const u = new URL(text);
        return u.protocol === 'http:' || u.protocol === 'https:';
      } catch {
        return false;
      }
    }

    // Drag & drop handlers
    function handleDragOver(e) {
      e.preventDefault();
      if (!state.dragOver) {
        state.dragOver = true;
        render();
      }
    }

    function handleDragLeave(e) {
      e.preventDefault();
      if (e.target === e.currentTarget) {
        state.dragOver = false;
        render();
      }
    }

    // Pull a source URL out of a DataTransfer/ClipboardData (text/uri-list, a plain-text
    // URL, or an <img src> inside text/html) - used for both drag & drop and paste.
    function findUrlInDataTransfer(dt) {
      if (!dt) return '';

      // If the dragged/copied HTML has an <img>, prefer the page it links to (the
      // nearest wrapping <a href>, common on shopping sites, Pinterest, search results)
      // over the image file's own URL - the parent page is far more useful to link back to.
      const htmlData = dt.getData('text/html') || '';
      if (htmlData) {
        const doc = new DOMParser().parseFromString(htmlData, 'text/html');
        const img = doc.querySelector('img');
        if (img) {
          const link = img.closest('a[href]');
          const linkHref = link && link.getAttribute('href');
          if (linkHref && isLikelyUrl(linkHref)) return linkHref;

          const imgSrc = img.getAttribute('src');
          if (imgSrc && isLikelyUrl(imgSrc)) return imgSrc;
        }
      }

      const uriList = dt.getData('text/uri-list') || '';
      const uriListUrl = uriList.split('\n').map(l => l.trim()).find(l => l && !l.startsWith('#')) || '';
      if (uriListUrl && isLikelyUrl(uriListUrl)) return uriListUrl;

      const plainText = (dt.getData('text/plain') || '').trim();
      if (isLikelyUrl(plainText)) return plainText;

      return '';
    }

    function handleDrop(e) {
      e.preventDefault();
      state.dragOver = false;
      render();

      const dt = e.dataTransfer;
      if (!dt) return;

      const files = Array.from(dt.files || []).filter(f => f.type && f.type.startsWith('image/'));
      // Some browsers also populate `files` with a synthesized File when dragging a
      // single <img> from another tab, alongside the URL data - grab the link either way.
      const url = findUrlInDataTransfer(dt);

      if (files.length) {
        if (files.length === 1 && url) {
          processFile(files[0], { url, title: null });
        } else {
          startBatch(files);
        }
        return;
      }

      if (url) addFromUrl(url);
    }

    // Paste an image from the clipboard (Cmd/Ctrl+V)
    function handlePaste(e) {
      if (state.view === 'add' || state.showSettings || state.showUrlModal || state.selectedOutfit) return;
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;

      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) {
            e.preventDefault();
            // "Copy Image" from a page often puts the source URL alongside the image bytes.
            const url = findUrlInDataTransfer(e.clipboardData);
            processFile(file, url ? { url, title: null } : null);
          }
          return;
        }
      }

      // No image data on the clipboard - if it's a URL, treat it like "Add from URL"
      // (which finds the biggest image on the page if it's not a direct image link).
      const text = e.clipboardData.getData('text/plain').trim();
      if (isLikelyUrl(text)) {
        e.preventDefault();
        addFromUrl(text);
      }
    }

    // Safari/WebKit only exposes clipboard images to an editable, focused element -
    // keep this invisible div focused so Cmd/Ctrl+V works with nothing else selected.
    function canCapturePaste() {
      return state.view === 'gallery' && !state.showSettings && !state.showUrlModal && !state.selectedOutfit;
    }

    function focusPasteTarget() {
      const el = document.getElementById('paste-target');
      const active = document.activeElement;
      const activeIsFormField = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT' || active.isContentEditable && active !== el);
      if (el && canCapturePaste() && !activeIsFormField) {
        el.focus({ preventScroll: true });
      }
    }

    // Update detected item
    function updateItem(index, field, value) {
      state.detectedItems[index][field] = value;
      render();
    }

    // Flip a status-pill button in place (so its CSS transition actually plays -
    // render() rebuilds the DOM wholesale, which would kill any transition), then
    // let the caller do a deferred render() once the animation has had time to run.
    function animateStatusPill(btn, active) {
      if (!btn) return;
      btn.dataset.slActive = String(active);
      btn.setAttribute('aria-pressed', String(active));
    }

    // In wardrobe or not - the add-outfit review screen's not-yet-saved items (no
    // cross-outfit propagation needed here).
    function toggleDetectedItemFlag(index, btn) {
      const item = state.detectedItems[index];
      item.inRealWardrobe = !item.inRealWardrobe;
      animateStatusPill(btn, item.inRealWardrobe);
      setTimeout(render, 200);
    }

    // Remove item
    function removeItem(index) {
      if (state.detectedItems.length > 1) {
        state.detectedItems.splice(index, 1);
        render();
      }
    }

    // Add new item
    function addNewItem() {
      state.detectedItems.push(blankDetectedItem());
      render();
    }

    // Escape untrusted text (e.g. a page <title> pulled from an external site) before
    // interpolating it into innerHTML.
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Escape untrusted text, then turn any **bold** markdown (Gemini sometimes writes
    // this even when asked not to) into real <strong> tags. Safe against injection since
    // it only ever wraps <strong> around already-escaped text.
    function escapeHtmlWithBold(str) {
      return escapeHtml(str).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    // Same safe escape-then-wrap approach, underlining wherever the current search
    // query appears in the (untrusted) name - splits on the raw string first, then
    // escapes each piece independently, so it's never injecting a tag into text that
    // hasn't been escaped yet.
    function highlightSearchMatch(name) {
      const q = state.searchQuery.trim();
      if (!q) return escapeHtml(name);
      const idx = name.toLowerCase().indexOf(q.toLowerCase());
      if (idx === -1) return escapeHtml(name);
      const before = name.slice(0, idx);
      const match = name.slice(idx, idx + q.length);
      const after = name.slice(idx + q.length);
      return `${escapeHtml(before)}<u>${escapeHtml(match)}</u>${escapeHtml(after)}`;
    }

    // Heart icon for the "wanted" affordance - filled when active, outline when not.
    function heartIcon(filled, extraClass) {
      const cls = `w-4 h-4 ${extraClass || ''}`;
      if (filled) {
        return `<svg class="${cls}" fill="currentColor" viewBox="0 0 24 24"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" /></svg>`;
      }
      return `<svg class="${cls}" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" /></svg>`;
    }

    // CSS background for a color+pattern swatch
    function swatchStyle(item) {
      const color = (item && item.color) || '#3b82f6';
      const pattern = (item && item.pattern) || 'solid';
      if (pattern === 'stripes-h') {
        return `background: repeating-linear-gradient(0deg, ${color} 0px, ${color} 3px, #ffffff 3px, #ffffff 6px);`;
      }
      if (pattern === 'stripes-v') {
        return `background: repeating-linear-gradient(90deg, ${color} 0px, ${color} 3px, #ffffff 3px, #ffffff 6px);`;
      }
      if (pattern === 'checkered') {
        return `background-color: #ffffff; background-image: linear-gradient(45deg, ${color} 25%, transparent 25%, transparent 75%, ${color} 75%, ${color}), linear-gradient(45deg, ${color} 25%, transparent 25%, transparent 75%, ${color} 75%, ${color}); background-size: 6px 6px; background-position: 0 0, 3px 3px;`;
      }
      return `background-color: ${color};`;
    }

    // Add outfit
    async function addOutfit() {
      const validItems = state.detectedItems.filter(i => i.name.trim());
      if (!validItems.length) return showToast('Add at least one item name');
      if (!state.currentImage) return;

      // The user has now confirmed the person-box position (or left it at
      // Gemini's detected default) - capture both before advanceQueueOrFinish()
      // clears currentImage* for the next draft (or the gallery).
      const rawImage = state.currentImage;
      const personBox = state.currentImagePersonBox;
      const studioFinishToken = state.autoStudioFinish ? state.currentImageToken : null;
      const studioFinishSwapGender = state.studioFinishSwapGender;
      const studioFinishPrompt = state.studioFinishPromptDraft || getDefaultStudioFinishPrompt(state.detectedItems);

      // currentImage is still the raw, uncropped upload - the confirmed person
      // box only gets applied to produce the actual saved photo right here,
      // once, at save time. Skipped when Studio Finish is about to run in the
      // background (studioFinishToken) - that pass gets its own copy of
      // rawImage + personBox and does its own pre-framing internally (see
      // generateStudioFinishImage), so showing the pre-framed crop here would
      // just be a version the user sees briefly and then watches get replaced -
      // show the untouched original in the meantime instead.
      const imageUrl = (personBox && !studioFinishToken) ? await frameForPersonHeight(rawImage, personBox) : rawImage;

      const outfit = {
        id: Date.now().toString(),
        name: validItems.map(i => i.name).join(', '),
        // Gemini's own name for the outfit as a whole (used as the detail modal's
        // heading - see renderDetailModal) - falls back to `name` above (the
        // item list) if detection didn't return one or was skipped.
        outfitName: state.detectedOutfitName || null,
        items: validItems,
        gender: state.detectedGender || 'unisex',
        imageUrl,
        aiPhoto: false,
        sourceUrl: state.currentImageSource ? state.currentImageSource.url : null,
        sourceTitle: state.currentImageSource ? state.currentImageSource.title : null,
        dateAdded: new Date().toISOString(),
        // Always null - the box above already got baked into imageUrl, so there's
        // nothing left to reuse it for (see applyStudioFinish's aiPhoto guard,
        // which only re-applies a personBox found on older outfits saved before
        // this field was added).
        personBox: null,
        ...(studioFinishToken ? { pendingStudioFinishToken: studioFinishToken } : {})
      };

      state.outfits.push(outfit);
      if (!(await saveData())) {
        state.outfits.pop();
        showToast('Storage full — export & remove some outfits, or try a smaller image');
        render();
        return;
      }
      showToast('Outfit added');

      // A newly detected outfit usually isn't "owned" yet (its items are new,
      // not yet matched against anything already marked owned - see
      // applyKnownOwnership), so it can land as "wanted". If the active status
      // filter would hide it, switch to "All" so the outfit you just added is
      // actually visible in the grid, rather than seeming to have vanished.
      if (state.statusFilter !== 'all' && getOutfitStatus(outfit) !== state.statusFilter) {
        state.statusFilter = 'all';
        localStorage.setItem('status-filter', 'all');
      }

      advanceQueueOrFinish(outfit);

      // Now that the outfit is confirmed and saved, run Studio Finish in the
      // background (not awaited) - it gets its own copy of the original box +
      // original (uncropped) bytes, captured above so a later draft's own edits
      // (the user may already be reviewing the next batch image) can't affect
      // this already-kicked-off pass.
      if (studioFinishToken) {
        runBackgroundStudioFinish(rawImage, studioFinishToken, personBox, studioFinishSwapGender, studioFinishPrompt);
      }
    }

    // Delete outfit
    async function deleteOutfit(id, e) {
      if (e) e.stopPropagation();
      const index = state.outfits.findIndex(o => o.id === id);
      if (index === -1) return;
      const removed = state.outfits[index];

      const finish = async () => {
        flipGrid.capture();
        state.outfits.splice(index, 1);
        state.selectedOutfit = null;
        await saveData();
        render();
        flipGrid.play();
        showUndoToast('Outfit deleted', async () => {
          flipGrid.capture();
          state.outfits.splice(Math.min(index, state.outfits.length), 0, removed);
          await saveData();
          showToast('Outfit restored');
          render();
          flipGrid.play();
        });
      };

      // Shrink + fade the card itself first (unless it's not on screen, or reduced motion).
      const card = document.querySelector(`.outfit-grid > [data-outfit-id="${(window.CSS && CSS.escape) ? CSS.escape(id) : id}"]`);
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (card && !reduce) {
        card.style.transition = 'transform 0.24s cubic-bezier(0.55, 0, 0.9, 0.35), opacity 0.24s ease';
        card.style.transform = 'scale(0.85)';
        card.style.opacity = '0';
        card.style.pointerEvents = 'none';
        setTimeout(finish, 190);
      } else {
        finish();
      }
    }

    // Set "in wardrobe" on every item sharing this name, across every outfit (e.g.
    // every "White T-shirt", not just the one on screen) - the same physical piece
    // should always agree with itself no matter which outfit it shows up in.
    function propagateFlagByName(name, value) {
      const key = normName(name);
      if (!key) return;
      state.outfits.forEach(outfit => {
        outfit.items.forEach(it => { if (normName(it.name) === key) it.inRealWardrobe = value; });
      });
      if (state.selectedOutfit) {
        state.selectedOutfit.items.forEach(it => { if (normName(it.name) === key) it.inRealWardrobe = value; });
      }
    }

    // Toggle "in wardrobe" for an item in the currently open outfit detail modal.
    async function togglePropagatedFlag(itemIndex, btn) {
      const item = state.selectedOutfit.items[itemIndex];
      const newValue = !item.inRealWardrobe;
      if (normName(item.name)) {
        propagateFlagByName(item.name, newValue);
      } else {
        // Unnamed items don't propagate anywhere, just flip this one.
        item.inRealWardrobe = newValue;
      }
      animateStatusPill(btn, newValue);
      setTimeout(render, 200);
      await saveData();
    }

    function toggleOwned(itemIndex, btn) {
      togglePropagatedFlag(itemIndex, btn);
    }

    // Toggle "in wardrobe" for a piece directly by name - used by the Pieces tab,
    // which has no selectedOutfit/itemIndex context to work from.
    async function togglePieceFlag(name, btn) {
      const piece = getAllPieces().find(p => normName(p.name) === normName(name));
      const newValue = !(piece && piece.inRealWardrobe);
      propagateFlagByName(name, newValue);
      animateStatusPill(btn, newValue);
      setTimeout(render, 200);
      await saveData();
    }

    // Edit an item's name/etc directly from the detail modal.
    async function updateSelectedOutfitItem(itemIndex, field, value) {
      const item = state.selectedOutfit.items[itemIndex];
      item[field] = value;

      const outfit = state.outfits.find(o => o.id === state.selectedOutfit.id);
      if (outfit) outfit.items[itemIndex][field] = value;

      await saveData();
      render();
    }

    // Remove one item from the outfit currently open in the detail modal.
    async function removeSelectedOutfitItem(itemIndex) {
      state.selectedOutfit.items.splice(itemIndex, 1);

      const outfit = state.outfits.find(o => o.id === state.selectedOutfit.id);
      if (outfit) outfit.items.splice(itemIndex, 1);

      await saveData();
      render();
    }

    // Open a Google Images search for an item name, e.g. "Black jacket outfit"
    function searchOutfitImages(itemName) {
      const url = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(itemName + ' outfit');
      window.open(url, '_blank', 'noopener');
    }

    // Crop just one detected item out of an outfit photo, using its normalized bounding
    // box plus a little padding for context. Returns a PNG blob, or null if there's no
    // usable box (falls back to the full image elsewhere).
    function cropItemImage(outfit, item) {
      return new Promise((resolve) => {
        if (!item.box) return resolve(null);
        const img = new Image();
        img.onload = () => {
          const pad = 0.06;
          const x = Math.max(0, item.box.x - pad) * img.naturalWidth;
          const y = Math.max(0, item.box.y - pad) * img.naturalHeight;
          const w = Math.min(1, item.box.x + item.box.width + pad) * img.naturalWidth - x;
          const h = Math.min(1, item.box.y + item.box.height + pad) * img.naturalHeight - y;
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, x, y, w, h, 0, 0, w, h);
          canvas.toBlob(resolve, 'image/png');
        };
        img.onerror = () => resolve(null);
        img.src = outfit.imageUrl;
      });
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    // Ask Gemini (with Google Search grounding) to identify this cropped item and find
    // where to buy it or similar pieces online - results (a short summary plus the
    // grounding source links) are stashed on the item itself (state.selectedOutfit is a
    // fresh throwaway copy per modal open, so this transient UI state naturally resets
    // next time the modal opens). Calling it again on an already-open result closes it.
    async function findItemOnline(itemIndex) {
      const outfit = state.selectedOutfit;
      const item = outfit.items[itemIndex];

      if (item._search && !item._search.loading) {
        item._search = null;
        render();
        return;
      }

      if (!state.geminiApiKey) {
        state.showSettings = true;
        render();
        showToast('Add your Gemini API key in Settings first');
        return;
      }

      item._search = { loading: true, summary: '', links: [] };
      render();

      try {
        const blob = await cropItemImage(outfit, item);
        const parts = [];
        if (blob) {
          parts.push({ inlineData: { mimeType: 'image/png', data: await blobToBase64(blob) } });
        }
        const descriptors = [
          outfit.gender && outfit.gender !== 'unisex' ? `${outfit.gender}'s` : null,
          item.fit && item.fit !== 'other' ? item.fit : null,
          item.material && item.material !== 'other' ? item.material : null
        ].filter(Boolean).join(' ');
        const itemLabel = [descriptors, item.name].filter(Boolean).join(' ');
        parts.push({
          text: `This is a photo of one clothing item${itemLabel ? ` (${itemLabel})` : ''}. Search the web and tell me where to buy this exact item or very similar ones. Prioritize retailers that ship to Europe (or have a European site) and give prices in EUR where possible, but don't mention Europe, shipping, or this preference in your written answer - just write about the item and where to get it. Keep the written answer to 2-3 sentences, plain prose with no markdown formatting.`
        });

        const response = await fetch(`${GEMINI_SEARCH_API_URL}?key=${encodeURIComponent(state.geminiApiKey)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts }],
            tools: [{ google_search: {} }]
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || 'Gemini API error');
        trackGeminiCost('generate', GEMINI_SEARCH_MODEL, data.usageMetadata);

        const candidate = data.candidates?.[0];
        const summary = (candidate?.content?.parts || []).map(p => p.text).filter(Boolean).join(' ');
        const chunks = candidate?.groundingMetadata?.groundingChunks || [];
        const links = chunks
          .map(c => c.web)
          .filter(w => w && w.uri)
          .map(w => ({ uri: w.uri, title: w.title || w.uri }));

        item._search = { loading: false, summary, links };
      } catch (err) {
        console.error('Gemini search error:', err);
        item._search = { loading: false, summary: '', links: [] };
        showToast('Search failed: ' + err.message);
      }
      render();
    }

    // --- Shared derivation helpers ---------------------------------------------------
    // Outfit ownership status is never stored, it's always computed from its items, so
    // there's no separate "flip to owned" step to forget to run - the moment every item
    // is owned, the outfit reads as owned everywhere at once.
    function normName(n) {
      return (n || '').trim().toLowerCase();
    }

    function getOutfitCompletion(outfit) {
      const total = outfit.items.length;
      const missing = outfit.items.filter(i => !i.inRealWardrobe);
      const ownedCount = total - missing.length;
      return { total, ownedCount, missing, pct: total ? ownedCount / total : 0 };
    }

    function getOutfitStatus(outfit) {
      if (!outfit.items.length) return 'wanted';
      return getOutfitCompletion(outfit).pct === 1 ? 'owned' : 'wanted';
    }

    // "owned " / "wanted " / "" (All doesn't read well here) - inserted before the
    // noun in count headings ("12 wanted outfits") to reflect the active filter.
    function statusFilterPrefix() {
      return state.statusFilter === 'owned' ? 'owned ' : state.statusFilter === 'wanted' ? 'wanted ' : '';
    }

    // Splits the query into independent lowercase words - "blue jeans white
    // tshirt" becomes ["blue","jeans","white","tshirt"]. Order-independent,
    // whitespace-tolerant (collapses multiple spaces), and a single-word
    // query behaves exactly as it always has (one term, .every()/.some()
    // reduce to one check) - see outfitMatchesSearch/pieceMatchesSearch.
    // A "term" is either a quoted phrase ("black pants") - kept whole, not
    // split further - or a single unquoted word. Quoted phrases are what
    // selectSearchPiece/addSearchTerm build when you pick a chip (see
    // below), so that a chip for "Black pants" only matches an item whose
    // name literally contains "black pants" together, not just "black"
    // and "pants" anywhere in the outfit - otherwise picking "Black pants" +
    // "White tshirt" chips could still match an outfit with White pants +
    // Black tshirt instead, since both words are present just on the wrong
    // items. Freely-typed unquoted queries are unaffected - "blue jeans
    // white tshirt" still splits into 4 independent words, same as before.
    function getSearchTerms() {
      const q = state.searchQuery.trim().toLowerCase();
      if (!q) return [];
      const terms = [];
      const re = /"([^"]+)"|(\S+)/g;
      let match;
      while ((match = re.exec(q))) terms.push(match[1] || match[2]);
      return terms;
    }

    // Every unique piece across the whole wardrobe, deduped by name (the same name is
    // already kept in sync owned/wanted-wise across outfits by togglePropagatedFlag).
    // Item names already come out of detection as "Color + Type" (e.g. "Black
    // jacket"), so a plain substring match against the name covers both a color
    // search and a piece-type search without needing a separate color lookup.
    // A piece is a single item, so every term of a multi-word query must appear
    // in its own name (unlike outfitMatchesSearch below, where different terms
    // can each be satisfied by a different item).
    function pieceMatchesSearch(piece) {
      const terms = getSearchTerms();
      const name = piece.name.toLowerCase();
      return !terms.length || terms.every(term => name.includes(term));
    }
    // An outfit matches a multi-word query (e.g. "blue jeans white tshirt") if
    // every word is found SOMEWHERE among its items - not necessarily the same
    // item per word, so "blue" and "jeans" can each match a different item than
    // "white"/"tshirt" do. Known tradeoff: an outfit with a Blue t-shirt + White
    // jeans would also match this same query, since all four words are present
    // just not paired the way the search implies - accepted for simplicity.
    function outfitMatchesSearch(outfit) {
      const terms = getSearchTerms();
      return !terms.length || terms.every(term => outfit.items.some(item => item.name.toLowerCase().includes(term)));
    }
    // Which specific items in this outfit matched, for showing "Blue jeans,
    // White tshirt" rather than the outfit's full item list in search results -
    // union across terms (any item matching ANY word), so every piece that
    // contributed to the outfit-level match shows up here.
    function getMatchingItems(outfit) {
      const terms = getSearchTerms();
      if (!terms.length) return [];
      return outfit.items.filter(item => {
        const name = item.name.toLowerCase();
        return terms.some(term => name.includes(term));
      });
    }

    function getAllPieces() {
      const map = new Map();
      state.outfits.forEach(outfit => {
        outfit.items.forEach(item => {
          const key = normName(item.name);
          if (!key || map.has(key)) return;
          map.set(key, { ...item, _outfit: outfit });
        });
      });
      return Array.from(map.values());
    }

    // Piece thumbnails crop a region out of the outfit photo, but we only have the box in
    // coordinates normalized to that photo's own width/height - fine for locating the
    // item, not enough on its own to crop into a square thumbnail without distortion,
    // since a box's width-fraction and height-fraction don't reflect real pixel
    // proportions unless the source photo happens to be square. So: measure each unique
    // outfit photo's real pixel size once (cached by URL), and use that to scale both
    // axes by the same factor - the box's longer real-pixel side fills the thumbnail,
    // the shorter side shows a little extra context instead of being stretched to fit.
    const imageDimsCache = new Map(); // imageUrl -> {width, height}

    function getImageDims(url) {
      if (imageDimsCache.has(url)) {
        const v = imageDimsCache.get(url);
        return v === 'pending' ? null : v;
      }
      imageDimsCache.set(url, 'pending');
      const img = new Image();
      img.onload = () => {
        imageDimsCache.set(url, { width: img.naturalWidth || 1, height: img.naturalHeight || 1 });
        render();
      };
      img.onerror = () => {
        imageDimsCache.set(url, { width: 1, height: 1 });
      };
      img.src = url;
      return null;
    }

    function pieceThumbStyle(piece) {
      const outfit = piece._outfit;
      if (!outfit) return '';
      const b = piece.box;
      if (!b) {
        return `background-image:url('${outfit.imageUrl}'); background-size:contain; background-position:center; background-repeat:no-repeat;`;
      }

      const dims = getImageDims(outfit.imageUrl);
      if (!dims) {
        // Still measuring - show the whole photo (undistorted) rather than guess a crop.
        return `background-image:url('${outfit.imageUrl}'); background-size:cover; background-position:center; background-repeat:no-repeat;`;
      }

      const { width: W, height: H } = dims;
      const bw = Math.max(0.02, Math.min(1, b.width));
      const bh = Math.max(0.02, Math.min(1, b.height));
      const boxPxW = bw * W;
      const boxPxH = bh * H;
      const maxBoxPx = Math.max(boxPxW, boxPxH);

      // Same scale ratio as the real image (W/H), so this can never stretch it.
      const sizeXPct = (W / maxBoxPx) * 100;
      const sizeYPct = (H / maxBoxPx) * 100;

      const posFor = (center, sizePct) => {
        const s = sizePct / 100;
        if (s <= 1) return 50;
        const visible = 1 / s;
        const start = Math.max(0, Math.min(1 - visible, center - visible / 2));
        return Math.max(0, Math.min(100, (start / (1 - visible)) * 100));
      };
      const posX = posFor(b.x + bw / 2, sizeXPct).toFixed(2);
      const posY = posFor(b.y + bh / 2, sizeYPct).toFixed(2);

      return `background-image:url('${outfit.imageUrl}'); background-size:${sizeXPct.toFixed(2)}% ${sizeYPct.toFixed(2)}%; background-position:${posX}% ${posY}%; background-repeat:no-repeat;`;
    }

    // The one function both the Pieces tab and the "Individual items" slice read from -
    // every wanted piece, tagged with how many Wanted outfits it would help complete.
    // Every Wanted outfit that still needs this piece (i.e. the outfit includes it,
    // but doesn't already own it) - the actual outfit objects, not just a count, so
    // the table view can show their photos.
    function getOutfitsNeedingPiece(pieceName) {
      const key = normName(pieceName);
      return state.outfits.filter(o =>
        getOutfitStatus(o) === 'wanted' &&
        o.items.some(i => normName(i.name) === key && !i.inRealWardrobe)
      );
    }

    // Every outfit this piece appears in at all, regardless of status - what the
    // Owned/All table view shows, where "still needs it" doesn't apply the same way.
    function getOutfitsWithPiece(pieceName) {
      const key = normName(pieceName);
      return state.outfits.filter(o => o.items.some(i => normName(i.name) === key));
    }

    // Every other distinct piece that shows up alongside this one in any
    // outfit - "siblings" shown in the search dropdown once a search narrows
    // to a single matching piece, so you can build a multi-item search (e.g.
    // "blue jeans" -> click "White tshirt" -> "blue jeans white tshirt")
    // without having to already know what to type next.
    function getSiblingPieces(pieceName) {
      const key = normName(pieceName);
      const map = new Map();
      getOutfitsWithPiece(pieceName).forEach(outfit => {
        outfit.items.forEach(item => {
          const itemKey = normName(item.name);
          if (!itemKey || itemKey === key || map.has(itemKey)) return;
          map.set(itemKey, item);
        });
      });
      return Array.from(map.values());
    }

    // The status (Owned/Wanted/All) + search filtering every Pieces-tab view and its
    // keyboard-nav sequence should agree on - one place instead of two copies that
    // could quietly drift apart.
    function getFilteredPieces() {
      return getAllPieces().filter(p => {
        if (state.statusFilter === 'owned' && !p.inRealWardrobe) return false;
        if (state.statusFilter === 'wanted' && p.inRealWardrobe) return false;
        return pieceMatchesSearch(p);
      });
    }

    function getWantedPieces() {
      return getAllPieces()
        .filter(p => !p.inRealWardrobe)
        .map(p => ({ ...p, outfitCount: getOutfitsNeedingPiece(p.name).length }))
        .sort((a, b) => b.outfitCount - a.outfitCount);
    }

    // Search is removed for now - this is a pass-through so callers don't need to change.
    function getFilteredOutfits() {
      return state.outfits;
    }

    function setMainTab(tab) {
      state.mainTab = tab;
      localStorage.setItem('main-tab', tab);
      render();
    }

    // Clicking the logo - back to the default view: Outfits tab, Owned filter,
    // no search, any modal closed.
    function goHome() {
      state.mainTab = 'outfits';
      localStorage.setItem('main-tab', 'outfits');
      state.statusFilter = 'owned';
      localStorage.setItem('status-filter', 'owned');
      state.searchQuery = '';
      state.searchOpen = false;
      state.searchActiveIndex = -1;
      state.selectedOutfit = null;
      state.showMenu = false;
      state.view = 'gallery';
      render();
    }

    // True when the query only makes sense as a search across MULTIPLE items
    // (e.g. "blue jeans white tshirt"), not an ordinary - if multi-word -
    // single-item search (e.g. "black leather jacket", which is exactly one
    // piece's name). Distinguishing the two matters because item names are
    // themselves usually 2+ words ("Color + Type"), so a raw word-count check
    // would misfire on every normal piece search. If some existing piece's
    // name already contains the whole query as-is, it's a single-item search;
    // otherwise, once there are 2+ words, it can only be a multi-item one.
    function isMultiItemSearch() {
      const terms = getSearchTerms();
      if (terms.length < 2) return false;
      const q = state.searchQuery.trim().toLowerCase();
      return !getAllPieces().some(p => p.name.toLowerCase().includes(q));
    }

    // The dropdown's chips in on-screen order (matching pieces row, then
    // "Also worn with" siblings row) - shared between renderSearchBox (for
    // rendering) and handleSearchKeydown (for arrow-key navigation/Enter/Tab),
    // so the two can never disagree about what index N refers to. `action`
    // says which click handler an Enter/Tab on that chip should trigger.
    function getSearchChips() {
      const allPieces = getAllPieces();
      // pieceMatchesSearch is a word-AND substring match, so a query that's
      // the exact name of one piece can still match OTHER pieces whose name
      // is a superset (e.g. "White tshirt" also matches "White star wars
      // tshirt" - both contain "white" and "tshirt" somewhere). That's fine
      // for general filtering, but here it meant clicking a chip for the
      // exact piece you wanted didn't actually narrow anything - the same
      // pieces stayed listed, so the click looked like it did nothing. An
      // exact (case-insensitive) name match always wins and narrows to just
      // that one piece, since that's unambiguous regardless of what other
      // pieces' names happen to also contain those words. Compared against
      // the single parsed term (quotes already stripped by getSearchTerms),
      // not the raw query string, since a chip-picked query is quoted.
      const terms = getSearchTerms();
      const exactMatch = terms.length === 1 ? allPieces.find(p => p.name.toLowerCase() === terms[0]) : null;
      const rawMatches = exactMatch ? [exactMatch] : allPieces.filter(pieceMatchesSearch).slice(0, 6);
      const siblingPieces = rawMatches.length === 1 ? getSiblingPieces(rawMatches[0].name) : [];
      // Once narrowed to exactly one piece WITH siblings to suggest, that
      // piece's own chip is redundant - it's already the whole query, sitting
      // right there in the input - so only offer its siblings. If it has no
      // siblings, keep showing its own chip instead, so the dropdown isn't
      // just empty with nothing to confirm the match happened.
      const matchingPieces = (rawMatches.length === 1 && siblingPieces.length) ? [] : rawMatches;
      return [
        ...matchingPieces.map(piece => ({ piece, action: 'select' })),
        ...siblingPieces.map(piece => ({ piece, action: 'add' }))
      ];
    }

    function setSearchQuery(value) {
      state.searchQuery = value;
      state.searchOpen = value.trim().length > 0;
      state.searchActiveIndex = -1; // the chip list is about to change - any old highlighted index is meaningless now
      // A multi-item search only makes sense against outfits (a single piece
      // can't "contain" more than itself) - switch to the Outfits tab
      // automatically so the results the dropdown promises are actually
      // visible in the grid once the dropdown is dismissed.
      if (isMultiItemSearch() && state.mainTab !== 'outfits') {
        state.mainTab = 'outfits';
        localStorage.setItem('main-tab', 'outfits');
      }
      render();
    }

    // Appends a sibling piece's name to the current search query, building a
    // multi-item search one click at a time (see getSiblingPieces and its use
    // in renderSearchBox). Goes through setSearchQuery so the Outfits-tab
    // auto-switch and searchOpen logic stay in sync, same as typing would.
    // Quoted (see getSearchTerms) so it's matched as one whole phrase against
    // a single item, not decomposed into separately-satisfiable words.
    function addSearchTerm(name) {
      const current = state.searchQuery.trim();
      const quoted = `"${name}"`;
      setSearchQuery(current ? `${current} ${quoted}` : quoted);
      const el = document.getElementById('search-input');
      if (el) {
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }
    }

    // Runs the same action a click on this chip would - selectSearchPiece for
    // a matching-piece chip, addSearchTerm for a sibling chip. Shared by
    // Enter and Tab in handleSearchKeydown below.
    function activateSearchChip(chip) {
      if (chip.action === 'add') addSearchTerm(chip.piece.name);
      else selectSearchPiece(chip.piece.name);
    }

    // Keyboard control for the dropdown, without ever moving DOM focus off
    // the input (so typing can resume immediately):
    //   ArrowDown  - enter the chip list from the input (highlights the
    //                first chip). Once already navigating, this is a no-op -
    //                use Left/Right to move around from there.
    //   ArrowLeft/
    //   ArrowRight - move the highlight between chips (they're laid out in a
    //                horizontal row, so left/right - not up/down - is what
    //                matches how they actually sit on screen). Clamped, not a
    //                wraparound loop: stops at the first/last chip. Only
    //                intercepted once a chip is already highlighted -
    //                otherwise these are left alone so they move the text
    //                cursor in the input like normal.
    //   ArrowUp    - always jumps straight back to the input (no highlight),
    //                regardless of which chip was highlighted - one press
    //                gets you back to typing from anywhere in the list.
    //   Enter      - activate the highlighted chip, if any
    //   Tab        - activate the highlighted chip, or the first one if none
    //                is highlighted yet (so Tab still "just completes" on the
    //                very first press)
    //   Escape     - drop the highlight without closing the dropdown
    // All of these no-op (falling through to native behavior) when the
    // dropdown isn't open or there's nothing to navigate to.
    function handleSearchKeydown(event) {
      if (!state.searchOpen) return;

      if (event.key === 'ArrowDown') {
        if (state.searchActiveIndex !== -1) return; // already navigating - Left/Right move between chips from here
        const chips = getSearchChips();
        if (!chips.length) return;
        event.preventDefault();
        state.searchActiveIndex = 0;
        render();
        return;
      }

      if (event.key === 'ArrowUp') {
        if (state.searchActiveIndex < 0) return; // already back at the input - nothing to do
        event.preventDefault();
        state.searchActiveIndex = -1;
        render();
        return;
      }

      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        if (state.searchActiveIndex < 0) return; // not navigating chips yet - let the browser move the text cursor instead
        const chips = getSearchChips();
        if (!chips.length) return;
        event.preventDefault();
        const dir = event.key === 'ArrowRight' ? 1 : -1;
        state.searchActiveIndex = Math.max(0, Math.min(chips.length - 1, state.searchActiveIndex + dir));
        render();
        return;
      }

      if (event.key === 'Enter') {
        if (state.searchActiveIndex < 0) return;
        const chip = getSearchChips()[state.searchActiveIndex];
        if (!chip) return;
        event.preventDefault();
        activateSearchChip(chip);
        return;
      }

      if (event.key === 'Escape') {
        if (state.searchActiveIndex < 0) return;
        state.searchActiveIndex = -1;
        render();
        return;
      }

      if (event.key !== 'Tab') return;
      const chips = getSearchChips();
      const chip = state.searchActiveIndex >= 0 ? chips[state.searchActiveIndex] : chips[0];
      if (!chip) return;
      event.preventDefault();
      // Deliberately lighter than Enter/activateSearchChip: Tab only fills in
      // the text (same as it always has) rather than fully "selecting" the
      // piece (which switches to the Pieces tab, etc.) - jumping tabs on a
      // plain Tab keystroke would be a surprising side effect for what reads
      // as a pure autocomplete action. A sibling chip has no lighter version
      // of "add this term", so it still goes through addSearchTerm either way.
      if (chip.action === 'add') {
        addSearchTerm(chip.piece.name);
        return;
      }
      setSearchQuery(`"${chip.piece.name}"`); // quoted (see getSearchTerms) so it stays phrase-exact even though Tab skips selectSearchPiece's other side effects
      const el = document.getElementById('search-input');
      if (el) {
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }
    }

    function clearSearch() {
      state.searchQuery = '';
      state.searchOpen = false;
      state.searchActiveIndex = -1;
      render();
      const el = document.getElementById('search-input');
      if (el) el.focus();
    }

    function closeSearchDropdown() {
      // Blur fires before a click on a dropdown item completes - a short delay lets
      // that click register before the dropdown (and the button being clicked) disappears.
      // It also fires on EVERY render (rebuilding the DOM destroys and recreates the
      // input, which forces a native blur even though nothing actually changed from
      // the user's perspective) - so only close if focus has genuinely landed
      // somewhere else by the time this runs, not just because a render happened to
      // land in between.
      setTimeout(() => {
        if (document.activeElement && document.activeElement.id === 'search-input') return;
        state.searchOpen = false;
        state.searchActiveIndex = -1;
        render();
      }, 150);
    }

    function selectSearchPiece(name) {
      state.mainTab = 'pieces';
      localStorage.setItem('main-tab', 'pieces');
      state.statusFilter = 'all';
      localStorage.setItem('status-filter', 'all');
      state.searchQuery = `"${name}"`; // narrow to exactly this piece (quoted - see getSearchTerms - so a later addSearchTerm building on top of this stays phrase-exact too), not whatever partial text was typed
      state.searchOpen = true; // keep the dropdown open - narrowing to one piece is what reveals its "Also worn with" siblings, so closing here would hide them right when they'd appear
      state.searchActiveIndex = -1; // the chip list is about to change (narrows to this piece + its siblings) - any old highlighted index is meaningless now
      render();
      const el = document.getElementById('search-input');
      if (el) {
        el.focus(); // so they can keep typing to refine, per how this was asked for
        el.setSelectionRange(el.value.length, el.value.length); // cursor at the end, not wherever the browser defaults to (start/select-all) on focus
      }
    }

    function setStatusFilter(status) {
      state.statusFilter = status;
      localStorage.setItem('status-filter', status);
      flipGrid.capture();
      render();
      flipGrid.play();
    }

    function setSortBy(sort) {
      state.sortBy = sort;
      localStorage.setItem('sort-by', sort);
      flipGrid.capture();
      render();
      flipGrid.play();
    }

    function setPiecesView(view) {
      state.piecesView = view;
      localStorage.setItem('pieces-view', view);
      render();
    }

    function setOutfitsView(view) {
      state.outfitsView = view;
      localStorage.setItem('outfits-view', view);
      render();
    }

    function setOutfitCols(n) {
      state.outfitCols = n;
      localStorage.setItem('outfit-cols', n);
      flipGrid.capture();
      render();
      flipGrid.play();
    }

    // The Pieces toolbar dropdown ('newest' | 'mostOutfits'). An explicit choice
    // here clears any table column-header sort so the dropdown is what's in effect.
    function setPiecesSort(value) {
      state.piecesSort = value;
      localStorage.setItem('pieces-sort', value);
      state.piecesSortColumn = null;
      localStorage.setItem('pieces-sort-column', '');
      render();
    }

    function setPiecesTableSort(column) {
      if (state.piecesSortColumn === column) {
        state.piecesSortDir = state.piecesSortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.piecesSortColumn = column;
        state.piecesSortDir = column === 'count' ? 'desc' : 'asc'; // most-needed first by default; names A-Z by default
      }
      localStorage.setItem('pieces-sort-column', state.piecesSortColumn);
      localStorage.setItem('pieces-sort-dir', state.piecesSortDir);
