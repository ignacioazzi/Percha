<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percha</title>
  <script>
    // Apply the dark class before first paint to avoid a light-mode flash.
    if (localStorage.getItem('dark-mode') === 'true' ||
        (!('dark-mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="morphdom.js"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="prompts.js"></script>
</head>
<body class="bg-white dark:bg-gray-900 min-h-screen">
  <!-- Split from one #app into two containers purely as a render()
       optimization: #app-main (header + gallery/add-view) is skipped on
       renders where an overlay modal (Detail/Settings/URL/Generate) is
       already open and stays open - e.g. typing in the Detail modal used to
       rebuild the entire (invisible, unrelated) gallery grid HTML on every
       keystroke. #app-overlay always rebuilds fully, since it's exactly the
       part the user is interacting with in that case. See render(). -->
  <div id="app-main"></div>
  <div id="app-overlay"></div>
  <div id="paste-target" contenteditable="true" tabindex="-1" style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none;"></div>

  <script type="module">
    const GEMINI_MODEL = 'gemini-2.5-flash-image';
    const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
    const GEMINI_SEARCH_MODEL = 'gemini-flash-latest';
    const GEMINI_SEARCH_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_SEARCH_MODEL}:generateContent`;
    const DEFAULT_STYLE_INSTRUCTIONS = 'Unless the request below explicitly says otherwise, keep the same colors, model gender, background, and overall style as the reference image (or as prior generations in this session) — only change what is specifically asked for.';
    // $ per 1M tokens, from Google's published Gemini API pricing. gemini-2.5-flash-image's
    // "output" tokens are image tokens (1290 tokens ≈ one 1024px image, $30/1M ≈ $0.039/image) -
    // a different rate than its text output would be. gemini-flash-latest is a rolling alias
    // Google doesn't price separately, so this uses Gemini 2.5 Flash's published text rates as
    // the closest stand-in - actual cost may drift if the alias points at a different model.
    const GEMINI_PRICING = {
      [GEMINI_MODEL]: { input: 0.30, output: 30.00 },
      [GEMINI_SEARCH_MODEL]: { input: 0.30, output: 2.50 }
    };
    // Studio Finish prompt text - ALL of it lives in prompts.js (loaded as globals
    // above), never inline here.
    const STUDIO_FINISH_INSTRUCTION = window.STUDIO_FINISH_INSTRUCTION;
    const STUDIO_FINISH_SWAP_GENDER_INSTRUCTION = window.STUDIO_FINISH_SWAP_GENDER_INSTRUCTION;

    // The Add/Review screen's editable Studio Finish prompt starts out as this -
    // the detected item names prepended to the base instruction so it's clear
    // which garments must survive unchanged. Once the user types anything into
    // that field their own text is used verbatim.
    function getDefaultStudioFinishPrompt(items) {
      const itemNames = (items || []).filter(i => i.name && i.name.trim()).map(i => i.name.trim());
      const itemsList = itemNames.length ? `Items in this outfit: ${itemNames.join(', ')}.\n\n` : '';
      return `${itemsList}${STUDIO_FINISH_INSTRUCTION}`;
mo    }
    // Ties an in-flight background Studio Finish call to the exact draft (or, once
    // saved, the exact outfit) it belongs to - not app state, so it lives outside state.
    let studioFinishCounter = 0;
    // Scratch state for an in-progress person-box drag - not app state, so it
    // doesn't trigger (or get destroyed by) render(); see startPersonBoxDrag.
    let personBoxDragSession = null;
    // Modal focus management (see render()): whether a modal was open on the
    // previous render, and whatever had focus right before the render that
    // opened the current one (so it can be restored once that modal closes).
    let modalWasOpen = false;
    let modalFocusTrigger = null;
    // Whether an "overlay" modal (Detail/Settings/URL/Generate) was open on
    // the previous render - see render()'s skipMainRebuild.
    let overlayModalWasOpen = false;

    // Which state flags currently put a modal-backdrop on screen - kept in
    // one place so the open/close focus transition (in render()) can't drift
    // out of sync with what render() actually decides to show.
    function isAnyModalOpen() {
      return !!(state.selectedOutfit || state.showSettings || state.showUrlModal || state.showStartOver || state.showGenerateModal || state.view === 'add');
    }

    // --- Preview mode --------------------------------------------------------
    // A CSS/layout-iteration aid: visit ?preview=1 (or #preview) to get a panel
    // (see renderPreviewPanel) that jumps straight to any screen with mock data,
    // so you can tweak styling without spending a single real Gemini call. Two
    // hard guarantees make it safe to click around in, not just "please don't":
    //   1. Every network call to the Gemini API is intercepted and rejected
    //      below - no key, quota, or cost is ever touched, no matter what
    //      button gets clicked while a mock screen is up.
    //   2. saveData() below is a no-op while this is active, so mock outfits
    //      can never overwrite your real IndexedDB wardrobe data.
    const PREVIEW_MODE = /[?&#]preview(=1)?\b/.test(location.search + location.hash);

    if (PREVIEW_MODE) {
      const realFetch = window.fetch.bind(window);
      window.fetch = (input, ...rest) => {
        const url = typeof input === 'string' ? input : input?.url || '';
        if (url.includes('generativelanguage.googleapis.com')) {
          console.warn('[preview mode] blocked a Gemini API call:', url);
          return Promise.reject(new Error('Blocked in preview mode — no Gemini calls are made while previewing screens.'));
        }
        return realFetch(input, ...rest);
      };
    }

    // --- Raw AI image inspection -------------------------------------------
    // Every image that comes back from Gemini is passed through debugRawImage()
    // BEFORE any resize/re-encode. It always stashes the untouched data URL on
    //   window.__lastRawImage        (most recent)
    //   window.__rawImages           (array of { label, url, ts })
    // and logs a line. Add ?rawimage to the URL (or run
    // localStorage.setItem('debug-raw-image','1')) to also pop each one open in
    // a new tab so you can eyeball it against the saved (resized) version.
    const DEBUG_RAW_IMAGE = /[?&#]rawimage\b/.test(location.search + location.hash)
      || localStorage.getItem('debug-raw-image') === '1';
    window.__rawImages = [];

    // Open a raw image entry in a new tab. Browsers block top-level navigation to
    // data: URLs (that's why plain window.open(dataUrl) does nothing), so open a
    // blank tab and write an <img> into it instead.
    window.viewRawImage = function (i) {
      const entry = (i == null) ? window.__rawImages[window.__rawImages.length - 1] : window.__rawImages[i];
      if (!entry) { console.warn('no raw image #' + i); return; }
      const w = window.open('', '_blank');
      if (!w) { console.warn('popup blocked — allow popups for this page, or use downloadRawImage()'); return; }
      w.document.write(`<title>raw: ${entry.label}</title><body style="margin:0;background:#111;display:grid;place-items:center;min-height:100vh"><img src="${entry.url}" style="max-width:100vw;max-height:100vh;object-fit:contain">`);
      w.document.close();
    };
    // Fallback if popups are blocked - saves the raw image to a file.
    window.downloadRawImage = function (i) {
      const entry = (i == null) ? window.__rawImages[window.__rawImages.length - 1] : window.__rawImages[i];
      if (!entry) { console.warn('no raw image #' + i); return; }
      const a = document.createElement('a');
      a.href = entry.url;
      a.download = `raw-${entry.label}-${entry.ts}.png`;
      a.click();
    };

    function debugRawImage(dataUrl, label = 'image') {
      if (!dataUrl) return dataUrl;
      window.__lastRawImage = dataUrl;
      window.__rawImages.push({ label, url: dataUrl, ts: Date.now() });
      const kb = Math.round((dataUrl.length * 0.75) / 1024);
      console.log(`[raw ${label}] ${kb} KB  —  viewRawImage()  or  downloadRawImage()`);
      if (DEBUG_RAW_IMAGE) window.viewRawImage();
      return dataUrl;
    }

    let state = {
      outfits: [],
      view: 'gallery',
      mainTab: localStorage.getItem('main-tab') || 'outfits', // 'outfits' | 'pieces' - activeFilters (item-name chips) removed for now
      statusFilter: localStorage.getItem('status-filter') || 'owned', // 'owned' | 'wanted' | 'all'
      sortBy: localStorage.getItem('sort-by') || 'recent', // 'default' | 'recent'
      piecesView: localStorage.getItem('pieces-view') || 'grid', // 'grid' | 'table'
      outfitsView: localStorage.getItem('outfits-view') || 'grid', // 'grid' | 'table'
      outfitCols: localStorage.getItem('outfit-cols') || '4', // '3' | '4' - gallery grid column count (lg+)
      searchQuery: '',
      searchOpen: false,
      searchActiveIndex: -1, // which dropdown chip ArrowUp/ArrowDown has highlighted, if any - see getSearchChips/handleSearchKeydown
      piecesSortColumn: localStorage.getItem('pieces-sort-column') || null, // null | 'name' | 'count'
      piecesSortDir: localStorage.getItem('pieces-sort-dir') || 'asc', // 'asc' | 'desc'
      piecesSort: localStorage.getItem('pieces-sort') || 'newest', // 'newest' | 'mostOutfits' - the toolbar dropdown on the Pieces tab
      selectedOutfit: null,
      modalImagePrev: null, // previous (pre-Studio-Finish) image, kept briefly during the detail modal's crossfade
      modalImageFading: false, // true only for the ~0.6s crossfade transition itself
      currentImage: null,
      currentImageSource: null, // { url, title } when the image came from a webpage/link
      currentImageToken: null, // ties the just-saved outfit to its pending background Studio Finish call
      // {x,y,width,height} fractions, always relative to currentImage itself
      // (the raw, uncropped upload - Studio Finish only ever runs after this
      // draft has already been confirmed and saved, see addOutfit). Shown as a
      // draggable/resizable box directly on the review
      // photo; the actual padded/framed image is only computed once, at save time
      // (addOutfit) or when Studio Finish runs - never baked into currentImage.
      currentImagePersonBox: null,
      currentImageDetectedBox: null, // permanent copy of the box Gemini detected - never mutated, so "Reset box" always has something to restore
      currentImageNaturalW: null, // natural pixel size of currentImage - needed for the box overlay's letterbox math
      currentImageNaturalH: null,
      detectedItems: [],
      detectedGender: 'unisex',
      detectedOutfitName: '', // Gemini's suggested name for the whole outfit - see addOutfit/outfit.outfitName
      processing: false,
      analyzing: false,
      analyzingFadeOut: false, // true only for the brief crossfade after analysis finishes - see analyzeOutfitWithAI
      addViewJustEntered: false, // true for exactly one render - see enterAddView
      showSettings: false,
      showMenu: false,
      showStartOver: false,
      // true only while walking the fresh paste/upload -> analyzing -> review ->
      // detail flow, so the modal's scale-in / stagger animations play once for a
      // new outfit but NOT when opening an existing outfit from the gallery.
      animateAddFlow: false,
      startOverBackedUp: false,
      showUrlModal: false,
      showGenerateModal: false,
      generatePrompt: '',
      generateGender: null,
      generateStyle: null,
      generateSeason: null,
      generateBackground: null,
      generateColorMode: null,
      generateCustomColors: [],
      generateVariants: [],
      editingVariantIndex: null,
      variantEditPrompt: '',
      variantEditing: false,
      variantSuggesting: false,
      generating: false,
      editing: false,
      studioFinishSwapGender: false, // "Toggle gender" checkbox on the Add/Review screen - unchecked by default, per-draft (reset in advanceQueueOrFinish), see addOutfit
      studioFinishPromptDraft: '', // editable Studio Finish prompt on the Add/Review screen - empty means "still showing the auto-built default" (see getDefaultStudioFinishPrompt); per-draft, reset in advanceQueueOrFinish
      dragOver: false,
      batchQueue: [],
      batchTotal: 0,
      batchIndex: 0,
      // Running totals for the two Gemini call sites the cost display tracks
      // separately: item detection and Studio Finish. Persisted (see loadCostTotals /
      // trackGeminiCost below) so they keep accumulating across reloads.
      costTotals: loadCostTotals(),
      geminiApiKey: localStorage.getItem('gemini-api-key') || '',
      styleInstructions: localStorage.getItem('gemini-style-instructions') ?? DEFAULT_STYLE_INSTRUCTIONS,
      autoStudioFinish: localStorage.getItem('auto-studio-finish') === null ? true : localStorage.getItem('auto-studio-finish') === 'true',
      // When on, the review screen skips the draggable person-box adjuster and
      // just uses Gemini's detected box as-is. Off (default) keeps the step.
      skipBoxAdjust: localStorage.getItem('skip-box-adjust') === 'true',
      darkMode: document.documentElement.classList.contains('dark')
    };

    function toggleDarkMode() {
      state.darkMode = !state.darkMode;
      document.documentElement.classList.toggle('dark', state.darkMode);
      localStorage.setItem('dark-mode', String(state.darkMode));
      render();
    }

    function toggleAutoStudioFinish() {
      state.autoStudioFinish = !state.autoStudioFinish;
      localStorage.setItem('auto-studio-finish', String(state.autoStudioFinish));
      render();
    }

    function toggleSkipBoxAdjust() {
      state.skipBoxAdjust = !state.skipBoxAdjust;
      localStorage.setItem('skip-box-adjust', String(state.skipBoxAdjust));
      render();
    }

    // Outfit data (images + items) lives in IndexedDB, not localStorage - localStorage's
    // ~5-10MB quota only fit ~40 outfits once images were in the mix. IndexedDB's quota is
    // typically hundreds of MB to GB, so this removes that ceiling. Everything else (API
    // key, small UI prefs) is tiny text and stays in localStorage, untouched.
    const IDB_NAME = 'virtual-wardrobe';
    const IDB_STORE = 'kv';
    const IDB_WARDROBE_KEY = 'wardrobe-data';
    let idbPromise = null;

    function openIdb() {
      if (!idbPromise) {
        idbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      return idbPromise;
    }

    function idbGet(key) {
      return openIdb().then(db => new Promise((resolve, reject) => {
        const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }));
    }

    function idbSet(key, value) {
      return openIdb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      }));
    }

    // Load data
    async function loadData() {
      let data = await idbGet(IDB_WARDROBE_KEY).catch(err => {
        console.error('IndexedDB load failed:', err);
        return null;
      });

      if (!data) {
        // One-time migration: earlier versions of this app stored everything in
        // localStorage under this same key - move it into IndexedDB (and clear it out
        // of localStorage, so it stops eating that much smaller budget) if found.
        const legacy = localStorage.getItem(IDB_WARDROBE_KEY);
        if (legacy) {
          try {
            data = JSON.parse(legacy);
            await idbSet(IDB_WARDROBE_KEY, data);
            localStorage.removeItem(IDB_WARDROBE_KEY);
          } catch (err) {
            console.error('Migration from localStorage failed:', err);
          }
        }
      }

      if (data) {
        state.outfits = data.outfits || [];
        // One-time cleanup: "wanted" used to be a separate flag from "owned", which
        // could drift out of sync (an item marked both, or neither, once the
        // standalone Wanted toggle was removed from the item-level UI). Ownership is
        // the only thing tracked per item now - "wanted" just means "not owned yet" -
        // so drop the old field entirely rather than leave ambiguous stored data around.
        let migrated = false;
        state.outfits.forEach(outfit => {
          outfit.items.forEach(item => {
            if ('wanted' in item) {
              delete item.wanted;
              migrated = true;
            }
          });
          // A pending Studio Finish pass only ever exists as an in-memory
          // promise chain (see runBackgroundStudioFinish) - it can't survive a
          // reload, so any outfit that still has this marker on load is one
          // whose pass died with the previous page (crash, close, or an error
          // from before this cleanup existed) rather than one still running.
          // Leaving it set would permanently hide the Studio Finish button and
          // stick the "Studio Finish..." badge on forever - see renderDetailModal.
          if (outfit.pendingStudioFinishToken) {
            delete outfit.pendingStudioFinishToken;
            migrated = true;
          }
        });
        if (migrated) await saveData();
      }
      render();
      checkStorageQuota(); // heads-up even if the wardrobe was already near-full before this session's first save
    }

    // Save data. Returns false (instead of throwing) if IndexedDB write fails.
    async function saveData() {
      if (PREVIEW_MODE) return true; // never persist mock/preview data over the real wardrobe
      try {
        await idbSet(IDB_WARDROBE_KEY, { outfits: state.outfits });
        checkStorageQuota(); // not awaited - a toast side effect, shouldn't hold up save()'s caller
        return true;
      } catch (err) {
        console.error('Save failed:', err);
        return false;
      }
    }

    // Only nag once per session rather than on every save once past the
    // threshold (e.g. mid-batch-upload would otherwise fire a toast per image).
    let storageQuotaWarned = false;

    // Proactive warning before storage actually runs out - the existing
    // "storage full" toast (see callers of saveData()) only fires reactively,
    // after a write has already failed.
    async function checkStorageQuota() {
      if (storageQuotaWarned || !navigator.storage || !navigator.storage.estimate) return;
      try {
        const { usage, quota } = await navigator.storage.estimate();
        if (quota && usage / quota >= 0.8) {
          storageQuotaWarned = true;
          showToast(`Storage is ${Math.round(usage / quota * 100)}% full — export & remove some outfits soon to avoid losing new ones`);
        }
      } catch (err) { /* not critical - just skip the warning */ }
    }

    // Downscale + re-encode an image to a reasonable size before storing/sending it.
    // Returns a data: URL (JPEG). Every edit re-compresses through this (the edited
    // result becomes the source for the next edit), so these caps directly control
    // how much detail survives repeated AI edits - raised from 1000px/0.75 to
    // 1600px/0.92 to cut down on the generational quality loss. Outfit data now lives
    // in IndexedDB (not localStorage), which has a much larger quota, so this is just
    // about keeping images a sane size, not staving off a ~40-outfit storage ceiling.
    function resizeImage(dataUrl, maxDim = 1600, quality = 0.92) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round(height * maxDim / width);
              width = maxDim;
            } else {
              width = Math.round(width * maxDim / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    // Cheap, deterministic safeguard applied to every upload before it ever reaches
    // Gemini: pads top/bottom with white so the original photo occupies at most
    // `maxRatio` of the final image height, regardless of how much of the frame the
    // subject actually fills. No subject detection involved - unlike autoFrameSubject
    // below, this doesn't try to be precise, it just guarantees the cap.
    function padToMaxHeightRatio(dataUrl, maxRatio = 0.75, quality = 0.92) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const { width, height } = img;
          const newHeight = Math.ceil(height / maxRatio);
          const padTotal = newHeight - height;
          const padTop = Math.floor(padTotal / 2);

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = newHeight;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, newHeight);
          ctx.drawImage(img, 0, padTop);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    // Recomposing a shot so the subject fills an exact % of the frame is something
    // image-editing models follow inconsistently no matter how the instruction is
    // worded - repeated testing on Studio Finish showed the subject landing anywhere
    // from ~30% to ~60% of frame height instead of the requested 85%, and separately,
    // despite explicitly telling the model not to add any border/frame/vignette, real
    // results kept coming back with either a hard picture-frame-style mat around the
    // photo, or (once that was fixed) a softer vignette darkening toward the edges -
    // both read as a visible "seam" since they survive scaling/cropping (a vignette in
    // particular is baked across the whole image, so no crop window avoids it).
    //
    // Rather than keep iterating on prompt wording for things models are inherently
    // unreliable at, this handles both problems deterministically, in two independently
    // toggleable stages (options.repaintBackground / options.recompose - both default
    // true, matching the original always-on behavior):
    //
    //   Stage A - repaintBackground (passes 1-3):
    //     1. A rough subject/background split (simple corner-color distance) - just
    //        good enough to know which region of the image to exclude when sampling
    //        "background" in the next step, so we don't accidentally sample the person.
    //        This pass always runs, even with repaintBackground off, since it's also
    //        the fallback bounding box for stage B below.
    //     2. Sample background color at a grid of points across the rest of the image,
    //        and fit a smooth model (inverse-distance-weighted interpolation) of
    //        "expected background color at position (x, y)" - this is what lets a
    //        vignette or gradient get predicted locally instead of compared against one
    //        flat global color.
    //     3. Walk every pixel: if its color is close to what that position's model
    //        predicts, it's background - repaint it to one flat target color (feathered
    //        at the boundary for a soft edge, not a hard cutout). Anything far from the
    //        local prediction is the subject and is left untouched. This also yields a
    //        much more accurate subject bounding box than pass 1's rough one.
    //
    //   Stage B - recompose (pass 4):
    //     4. Scale + crop so the subject (from whichever bounding box stage A left
    //        behind - the precise one if it ran, the rough one from pass 1 if not)
    //        fills ~85% of the frame height.
    //
    // Falls back to the untouched image at any point detection looks unreliable,
    // rather than risk a broken repaint.
    function autoFrameSubject(dataUrl, options = {}) {
      const {
        targetHeightFraction = 0.85,
        aspectW = 3,
        aspectH = 4,
        repaintBackground = true,
        recompose = true
      } = options;

      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          try {
            const iw = img.naturalWidth;
            const ih = img.naturalHeight;
            const srcCanvas = document.createElement('canvas');
            srcCanvas.width = iw;
            srcCanvas.height = ih;
            const srcCtx = srcCanvas.getContext('2d');
            srcCtx.drawImage(img, 0, 0);
            const imgData = srcCtx.getImageData(0, 0, iw, ih);
            const data = imgData.data;

            const sampleAt = (x, y) => {
              const i = (y * iw + x) * 4;
              return [data[i], data[i + 1], data[i + 2]];
            };

            // --- Pass 1: rough subject bbox from the four corners. Always runs -
            // it's both the exclusion zone for pass 2's background sampling, and the
            // fallback bounding box for recompose when repaintBackground is off.
            const corners = [sampleAt(3, 3), sampleAt(iw - 4, 3), sampleAt(3, ih - 4), sampleAt(iw - 4, ih - 4)];
            const cornerBg = [0, 1, 2].map(c => Math.round(corners.reduce((s, p) => s + p[c], 0) / corners.length));

            const roughThreshold = 30;
            const roughStep = 4;
            let rMinX = iw, rMinY = ih, rMaxX = 0, rMaxY = 0, roughFound = false;
            for (let y = 0; y < ih; y += roughStep) {
              for (let x = 0; x < iw; x += roughStep) {
                const i = (y * iw + x) * 4;
                const dr = data[i] - cornerBg[0], dg = data[i + 1] - cornerBg[1], db = data[i + 2] - cornerBg[2];
                if (dr * dr + dg * dg + db * db > roughThreshold * roughThreshold) {
                  roughFound = true;
                  if (x < rMinX) rMinX = x;
                  if (x > rMaxX) rMaxX = x;
                  if (y < rMinY) rMinY = y;
                  if (y > rMaxY) rMaxY = y;
                }
              }
            }

            const roughCoverage = roughFound ? ((rMaxX - rMinX) * (rMaxY - rMinY)) / (iw * ih) : 0;
            if (!roughFound || roughCoverage < 0.01 || roughCoverage > 0.97) {
              resolve(dataUrl);
              return;
            }

            // Bounding box + flat backdrop color that stage B (recompose) will use -
            // filled in by stage A below if it runs, otherwise these stay at pass 1's
            // rough values (and flatBg falls back to the plain corner-average color).
            let sMinX = rMinX, sMinY = rMinY, sMaxX = rMaxX, sMaxY = rMaxY;
            let flatBg = cornerBg;

            if (repaintBackground) {
              // Expand the rough box before excluding it - better to under-sample near
              // the person than accidentally pull hair/shadow pixels in as "background".
              const padX = (rMaxX - rMinX) * 0.12;
              const padY = (rMaxY - rMinY) * 0.12;
              const exMinX = Math.max(0, rMinX - padX), exMaxX = Math.min(iw, rMaxX + padX);
              const exMinY = Math.max(0, rMinY - padY), exMaxY = Math.min(ih, rMaxY + padY);

              // --- Pass 2: sample background color on a grid across the whole image
              // (skipping the exclusion zone), then fit a coarse IDW model from those
              // samples so "expected background" can vary smoothly with position.
              const gridStep = Math.max(16, Math.round(Math.min(iw, ih) / 24));
              const samples = [];
              for (let y = 0; y < ih; y += gridStep) {
                for (let x = 0; x < iw; x += gridStep) {
                  if (x >= exMinX && x <= exMaxX && y >= exMinY && y <= exMaxY) continue;
                  const [r, g, b] = sampleAt(Math.min(x, iw - 1), Math.min(y, ih - 1));
                  samples.push({ x, y, r, g, b });
                }
              }

              if (samples.length < 8) {
                // Not enough clean background to model reliably - don't risk a bad
                // repaint, just fall through to recompose (or not) using the rough box.
                if (!recompose) { resolve(dataUrl); return; }
              } else {
                const median = (arr) => { const s = [...arr].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
                flatBg = [median(samples.map(s => s.r)), median(samples.map(s => s.g)), median(samples.map(s => s.b))];

                const modelGrid = 12;
                const bgGrid = [];
                for (let gy = 0; gy < modelGrid; gy++) {
                  const row = [];
                  const py = (gy / (modelGrid - 1)) * ih;
                  for (let gx = 0; gx < modelGrid; gx++) {
                    const px = (gx / (modelGrid - 1)) * iw;
                    let wSum = 0, rSum = 0, gSum = 0, bSum = 0;
                    for (const s of samples) {
                      const dx = s.x - px, dy = s.y - py;
                      const w = 1 / (dx * dx + dy * dy + 64);
                      wSum += w; rSum += w * s.r; gSum += w * s.g; bSum += w * s.b;
                    }
                    row.push([rSum / wSum, gSum / wSum, bSum / wSum]);
                  }
                  bgGrid.push(row);
                }
                const lookupBg = (x, y) => {
                  const gx = (x / iw) * (modelGrid - 1), gy = (y / ih) * (modelGrid - 1);
                  const gx0 = Math.floor(gx), gy0 = Math.floor(gy);
                  const gx1 = Math.min(modelGrid - 1, gx0 + 1), gy1 = Math.min(modelGrid - 1, gy0 + 1);
                  const tx = gx - gx0, ty = gy - gy0;
                  const c00 = bgGrid[gy0][gx0], c10 = bgGrid[gy0][gx1], c01 = bgGrid[gy1][gx0], c11 = bgGrid[gy1][gx1];
                  const lerp = (a, b, t) => a + (b - a) * t;
                  return [0, 1, 2].map(k => lerp(lerp(c00[k], c10[k], tx), lerp(c01[k], c11[k], tx), ty));
                };

                // --- Pass 3: repaint background pixels to one flat color, feathered at
                // the boundary, and measure a precise subject bbox along the way - this
                // is measured against each pixel's own local background prediction, so
                // it isn't thrown off by a vignette the way the pass-1 rough box could be.
                const classifyThreshold = 26;
                const featherBand = 10;
                let pMinX = iw, pMinY = ih, pMaxX = 0, pMaxY = 0, subjectFound = false;

                for (let y = 0; y < ih; y++) {
                  for (let x = 0; x < iw; x++) {
                    const i = (y * iw + x) * 4;
                    const [er, eg, eb] = lookupBg(x, y);
                    const dr = data[i] - er, dg = data[i + 1] - eg, db = data[i + 2] - eb;
                    const dist = Math.sqrt(dr * dr + dg * dg + db * db);

                    if (dist < classifyThreshold) {
                      data[i] = flatBg[0]; data[i + 1] = flatBg[1]; data[i + 2] = flatBg[2];
                    } else if (dist < classifyThreshold + featherBand) {
                      const t = (dist - classifyThreshold) / featherBand;
                      data[i] = Math.round(flatBg[0] + (data[i] - flatBg[0]) * t);
                      data[i + 1] = Math.round(flatBg[1] + (data[i + 1] - flatBg[1]) * t);
                      data[i + 2] = Math.round(flatBg[2] + (data[i + 2] - flatBg[2]) * t);
                      subjectFound = true;
                      if (x < pMinX) pMinX = x;
                      if (x > pMaxX) pMaxX = x;
                      if (y < pMinY) pMinY = y;
                      if (y > pMaxY) pMaxY = y;
                    } else {
                      subjectFound = true;
                      if (x < pMinX) pMinX = x;
                      if (x > pMaxX) pMaxX = x;
                      if (y < pMinY) pMinY = y;
                      if (y > pMaxY) pMaxY = y;
                    }
                  }
                }

                if (!subjectFound) { resolve(dataUrl); return; }
                sMinX = pMinX; sMinY = pMinY; sMaxX = pMaxX; sMaxY = pMaxY;
                srcCtx.putImageData(imgData, 0, 0);
              }
            }

            if (!recompose) {
              // Background may or may not have been repainted above, but no
              // scale/crop - return the image at its original framing and resolution.
              resolve(srcCanvas.toDataURL('image/png'));
              return;
            }

            // --- Pass 4: scale + crop to hit the target height, using whichever
            // bounding box stage A left behind (precise if it ran, rough if not).
            const bw = sMaxX - sMinX;
            const bh = sMaxY - sMinY;
            const cx = (sMinX + sMaxX) / 2;
            const cy = (sMinY + sMaxY) / 2;

            const outH = ih;
            const outW = Math.round(outH * (aspectW / aspectH));

            const scaleByHeight = (targetHeightFraction * outH) / bh;
            const scaleByWidth = (outW * 0.96) / bw;
            const scale = Math.min(scaleByHeight, scaleByWidth);

            const scaledW = Math.round(iw * scale);
            const scaledH = Math.round(ih * scale);
            const scaledCanvas = document.createElement('canvas');
            scaledCanvas.width = scaledW;
            scaledCanvas.height = scaledH;
            scaledCanvas.getContext('2d').drawImage(srcCanvas, 0, 0, iw, ih, 0, 0, scaledW, scaledH);

            const outCanvas = document.createElement('canvas');
            outCanvas.width = outW;
            outCanvas.height = outH;
            const outCtx = outCanvas.getContext('2d');

            if (scaledW >= outW && scaledH >= outH) {
              let cropX = Math.round(cx * scale - outW / 2);
              let cropY = Math.round(cy * scale - outH / 2);
              cropX = Math.max(0, Math.min(cropX, scaledW - outW));
              cropY = Math.max(0, Math.min(cropY, scaledH - outH));
              // Hairline blur - not correcting the crop, just softening any leftover
              // JPEG ringing right at the subject/background boundary (the highest-
              // contrast edge in the photo, so where re-encoding artifacts show worst).
              outCtx.filter = 'blur(0.6px)';
              outCtx.drawImage(scaledCanvas, cropX, cropY, outW, outH, 0, 0, outW, outH);
              outCtx.filter = 'none';
            } else {
              // Rare: the model already overshot the framing, so the scaled image is
              // smaller than the target canvas in some dimension. The fill color here
              // matches flatBg exactly, so it's the same flat backdrop as everywhere
              // else in the image - no separate seam introduced by this fallback.
              outCtx.fillStyle = `rgb(${flatBg[0]}, ${flatBg[1]}, ${flatBg[2]})`;
              outCtx.fillRect(0, 0, outW, outH);
              outCtx.drawImage(scaledCanvas, (outW - scaledW) / 2, (outH - scaledH) / 2);
            }

            // Lossless intermediate - resizeImage() right after this is where the one
            // and only lossy JPEG encode should happen, to avoid double-compressing.
            resolve(outCanvas.toDataURL('image/png'));
          } catch (err) {
            console.error('autoFrameSubject error:', err);
            resolve(dataUrl); // fall back to the model's own output rather than fail the edit
          }
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    // Deterministically pre-frame the ORIGINAL uploaded photo (before any Gemini
    // edit) so the person already sits at `targetHeightFraction` of a 3:4 frame -
    // handing Gemini a "small nudge" studio relight instead of asking its edit to
    // also recompose the whole shot, which it's unreliable at. Unlike
    // autoFrameSubject (which runs AFTER the edit as a safety net and has to guess
    // the subject from background color), this uses the real personBox Gemini
    // already returned from the same detection call that runs on every upload -
    // no extra API cost. Resolves to the untouched dataUrl if personBox is missing
    // or anything goes wrong.
    function frameForPersonHeight(dataUrl, personBox, options = {}) {
      const { targetHeightFraction = 0.85, aspectW = 3, aspectH = 4, allowPad = true } = options;

      return new Promise((resolve) => {
        if (!personBox) { resolve(dataUrl); return; }
        const img = new Image();
        img.onload = () => {
          try {
            const iw = img.naturalWidth;
            const ih = img.naturalHeight;

            const bx = personBox.x * iw, by = personBox.y * ih;
            const bw = personBox.width * iw, bh = personBox.height * ih;
            const cx = bx + bw / 2, cy = by + bh / 2;

            const outH = ih;
            const outW = Math.round(outH * (aspectW / aspectH));

            const scaleByHeight = (targetHeightFraction * outH) / bh;
            const scaleByWidth = (outW * 0.96) / bw;
            const scale = Math.min(scaleByHeight, scaleByWidth);

            const scaledW = Math.round(iw * scale);
            const scaledH = Math.round(ih * scale);

            const outCanvas = document.createElement('canvas');
            outCanvas.width = outW;
            outCanvas.height = outH;
            const outCtx = outCanvas.getContext('2d');

            if (scaledW >= outW && scaledH >= outH) {
              // Enough surrounding photo to crop to the target frame.
              const scaledCanvas = document.createElement('canvas');
              scaledCanvas.width = scaledW;
              scaledCanvas.height = scaledH;
              scaledCanvas.getContext('2d').drawImage(img, 0, 0, iw, ih, 0, 0, scaledW, scaledH);

              let cropX = Math.round(cx * scale - outW / 2);
              let cropY = Math.round(cy * scale - outH / 2);
              cropX = Math.max(0, Math.min(cropX, scaledW - outW));
              cropY = Math.max(0, Math.min(cropY, scaledH - outH));
              outCtx.drawImage(scaledCanvas, cropX, cropY, outW, outH, 0, 0, outW, outH);
            } else if (!allowPad) {
              // Not enough surrounding photo to crop to target, and this caller doesn't
              // want a padded composite (e.g. Studio Finish's pre-framing - Gemini is
              // about to replace the whole background anyway, so there's no reason to
              // hand it a synthetic blurred backdrop it might not fully paint over,
              // leaving a baked-in "second blurred photo" behind the subject in the
              // final result). Just skip pre-framing and hand back the photo untouched.
              resolve(dataUrl);
              return;
            } else {
              // Not enough surrounding photo to crop to target - pad with a blurred,
              // scaled-up copy of the same photo instead of a flat fill. A flat/white
              // fill here gets picked up and preserved by Gemini as an actual border
              // in its output; a blurred-photo backdrop gives it believable content
              // to extend/repaint instead of a hard edge to preserve.
              const coverScale = Math.max(outW / iw, outH / ih) * 1.15; // slight overscan to hide the blur's edge softening
              const bgW = Math.round(iw * coverScale);
              const bgH = Math.round(ih * coverScale);
              // Radius scaled to the canvas, not a fixed pixel count - a fixed 24px
              // barely softens anything at this app's ~1200-1600px photo widths, so
              // recognizable shapes stayed legible and the backdrop read as a second,
              // only-slightly-softer copy of the same photo sitting behind the sharp
              // foreground copy, instead of an abstract blurred backdrop.
              const blurRadius = Math.round(outW * 0.06);
              outCtx.filter = `blur(${blurRadius}px)`;
              outCtx.drawImage(img, 0, 0, iw, ih, (outW - bgW) / 2, (outH - bgH) / 2, bgW, bgH);
              outCtx.filter = 'none';

              const fgLeft = Math.round(outW / 2 - scale * cx);
              const fgTop = Math.round(outH / 2 - scale * cy);
              outCtx.drawImage(img, 0, 0, iw, ih, fgLeft, fgTop, scaledW, scaledH);
            }

            resolve(outCanvas.toDataURL('image/png'));
          } catch (err) {
            console.error('frameForPersonHeight error:', err);
            resolve(dataUrl);
          }
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    // Geometry of an `object-fit: cover` image inside its container - scale plus
    // the (usually negative, since cover overflows its box) crop offsets -
    // shared by the crop-adjuster's screen<->image coordinate conversions below.
    // Matches the review photo in renderAddView, which uses object-cover so the
    // frame is always filled - Math.max (vs. Math.min for contain/letterboxing)
    // is what makes this cover math instead.
    function computeContainGeometry(containerRect, naturalW, naturalH) {
      const scale = Math.max(containerRect.width / naturalW, containerRect.height / naturalH);
      const dispW = naturalW * scale, dispH = naturalH * scale;
      const offsetX = (containerRect.width - dispW) / 2;
      const offsetY = (containerRect.height - dispH) / 2;
      return { scale, dispW, dispH, offsetX, offsetY };
    }

    // Client (viewport) coordinates -> image-fraction coordinates, accounting for
    // the container's letterboxing. Clamped to [0,1] so dragging past the edge
    // of the image just pins to that edge instead of going out of bounds.
    function clientPointToImageFraction(clientX, clientY, containerRect, naturalW, naturalH) {
      const { dispW, dispH, offsetX, offsetY } = computeContainGeometry(containerRect, naturalW, naturalH);
      const x = Math.max(0, Math.min(1, (clientX - containerRect.left - offsetX) / dispW));
      const y = Math.max(0, Math.min(1, (clientY - containerRect.top - offsetY) / dispH));
      return { x, y };
    }

    // Image-fraction box -> container-relative percentages, for positioning the
    // crop-adjuster overlay div. Must go through the same letterbox offsets as
    // above - box.x*100 alone would drift off the actual photo whenever its
    // aspect ratio doesn't match the container's.
    function imageBoxToContainerStyle(box, containerRect, naturalW, naturalH) {
      const { dispW, dispH, offsetX, offsetY } = computeContainGeometry(containerRect, naturalW, naturalH);
      return {
        leftPct: ((offsetX + box.x * dispW) / containerRect.width) * 100,
        topPct: ((offsetY + box.y * dispH) / containerRect.height) * 100,
        widthPct: (box.width * dispW / containerRect.width) * 100,
        heightPct: (box.height * dispH / containerRect.height) * 100
      };
    }

    // Natural pixel size of a dataUrl image - needed by the crop adjuster to do
    // the letterbox math above.
    function loadImageNaturalSize(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ naturalW: img.naturalWidth, naturalH: img.naturalHeight });
        img.onerror = () => resolve({ naturalW: 1, naturalH: 1 });
        img.src = dataUrl;
      });
    }

    // Cheap perceptual dedupe check (see findLikelyDuplicateOutfit below) - an
    // 8x8 average hash (64 bits: 1 if a pixel is brighter than the image's
    // mean brightness, else 0). Enough to catch "this is basically the same
    // photo" even after re-compression/resizing, without any ML or network
    // call. Resolves null (never matches anything) if the image fails to load.
    function computeAverageHash(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const size = 8;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, size, size);
          const { data } = ctx.getImageData(0, 0, size, size);
          const gray = [];
          for (let i = 0; i < data.length; i += 4) {
            gray.push((data[i] + data[i + 1] + data[i + 2]) / 3);
          }
          const mean = gray.reduce((a, b) => a + b, 0) / gray.length;
          resolve(gray.map(v => (v > mean ? 1 : 0)));
        };
        img.onerror = () => resolve(null);
        img.src = dataUrl;
      });
    }

    function hammingDistance(a, b) {
      if (!a || !b || a.length !== b.length) return Infinity;
      let dist = 0;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) dist++;
      return dist;
    }

    // Hashes are cached per outfit id in memory only (never persisted) -
    // recomputing them is cheap and this way there's no extra field on the
    // outfit record to keep migrated/in sync with imageUrl.
    const outfitHashCache = {};

    async function getOutfitHash(outfit) {
      if (!(outfit.id in outfitHashCache)) {
        outfitHashCache[outfit.id] = await computeAverageHash(outfit.imageUrl);
      }
      return outfitHashCache[outfit.id];
    }

    // Returns the first existing outfit whose photo looks essentially
    // identical to dataUrl, or null if none are close enough. Threshold is
    // out of 64 bits - tolerant of recompression/resizing, not of a genuinely
    // different photo.
    async function findLikelyDuplicateOutfit(dataUrl) {
      const hash = await computeAverageHash(dataUrl);
      if (!hash) return null;
      const threshold = 5;
      for (const outfit of state.outfits) {
        const outfitHash = await getOutfitHash(outfit);
        if (hammingDistance(hash, outfitHash) <= threshold) return outfit;
      }
      return null;
    }

    // Studio Finish's edit call + the deterministic reframe above + the standard
    // storage-size compression, in the order they need to run. Shared by the
    // one-click button and the auto-on-upload background pass. `personBox`
    // (from detection, fraction coords) pre-frames the input before the edit when
    // available - see frameForPersonHeight - falling back to editing the photo as-is
    // when it isn't (no detection ever ran, or it didn't find a person).
    async function generateStudioFinishImage(mimeType, base64, personBox, extraInstruction, basePrompt) {
      let editMimeType = mimeType, editBase64 = base64;
      if (personBox) {
        // allowPad: false - if the photo's too tight to pre-frame cleanly, skip
        // pre-framing rather than hand Gemini a blurred-pad composite (see
        // frameForPersonHeight) - Gemini's about to replace the whole background
        // anyway, so there's nothing to gain and a real risk of that padding
        // surviving, unpainted, into the final Studio Finish result.
        const preFramed = await frameForPersonHeight(`data:${mimeType};base64,${base64}`, personBox, { allowPad: false });
        const [header, framedBase64] = preFramed.split(',');
        editMimeType = (header.match(/data:(.*);base64/) || [])[1] || mimeType;
        editBase64 = framedBase64;
      }
      // basePrompt lets a caller swap in a customized/items-prepended version
      // (see getDefaultStudioFinishPrompt, used by the Add/Review screen's
      // editable prompt textarea) instead of the fixed STUDIO_FINISH_INSTRUCTION.
      const base = basePrompt || STUDIO_FINISH_INSTRUCTION;
      const prompt = extraInstruction ? `${base} ${extraInstruction}` : base;
      const raw = await callGeminiImage(prompt, { mimeType: editMimeType, data: editBase64 }, '3:4', { skipStyleInstructions: true, costBucket: 'studioFinish' });
      // No local reframe/repaint - Gemini's output is taken as-is; only the
      // storage-size re-encode below (resizeImage: max 1600px, JPEG q0.92). The
      // untouched result is captured by debugRawImage() inside callGeminiImage.
      return resizeImage(raw);
    }

    // Reset the live-editable box back to whatever Gemini originally detected,
    // discarding any drag the user has done to it.
    function resetPersonBoxToDetected() {
      if (!state.currentImageDetectedBox) return;
      state.currentImagePersonBox = { ...state.currentImageDetectedBox };
      render();
    }

    // Reposition the person-box overlay from state.currentImagePersonBox - called
    // from render() (see its end) since it needs the stage element's real
    // on-screen size, which only exists post-DOM-insertion.
    function syncPersonBoxPosition() {
      const box = state.currentImagePersonBox;
      const containerEl = document.getElementById('person-box-stage');
      const boxEl = document.getElementById('person-box');
      if (!box || !containerEl || !boxEl) return;
      const rect = containerEl.getBoundingClientRect();
      const style = imageBoxToContainerStyle(box, rect, state.currentImageNaturalW, state.currentImageNaturalH);
      boxEl.style.left = style.leftPct + '%';
      boxEl.style.top = style.topPct + '%';
      boxEl.style.width = style.widthPct + '%';
      boxEl.style.height = style.heightPct + '%';
    }

    // Begin dragging the person box directly on the review photo (handle is
    // 'move', 'top', or 'bottom'). Reads the container's bounding rect once up
    // front and mutates the overlay's style directly during the drag (see
    // onPersonBoxDragMove) - no render() per move. The box is applied to the
    // actual padded/framed image later, at save time or when Studio Finish
    // runs - never baked into currentImage here.
    function startPersonBoxDrag(event, handle, containerEl) {
      if (!state.currentImagePersonBox) return;
      event.preventDefault();
      event.stopPropagation();
      personBoxDragSession = {
        handle,
        containerRect: containerEl.getBoundingClientRect(),
        startBox: { ...state.currentImagePersonBox },
        startPoint: clientPointToImageFraction(event.clientX, event.clientY, containerEl.getBoundingClientRect(), state.currentImageNaturalW, state.currentImageNaturalH),
        pendingBox: null
      };
      document.addEventListener('pointermove', onPersonBoxDragMove);
      document.addEventListener('pointerup', onPersonBoxDragEnd, { once: true });
    }

    const PERSON_BOX_MIN_HEIGHT = 0.1;

    function onPersonBoxDragMove(event) {
      const session = personBoxDragSession;
      if (!session) return;
      const point = clientPointToImageFraction(event.clientX, event.clientY, session.containerRect, state.currentImageNaturalW, state.currentImageNaturalH);
      const dx = point.x - session.startPoint.x;
      const dy = point.y - session.startPoint.y;
      const start = session.startBox;
      let box;

      if (session.handle === 'move') {
        const x = Math.max(0, Math.min(1 - start.width, start.x + dx));
        const y = Math.max(0, Math.min(1 - start.height, start.y + dy));
        box = { x, y, width: start.width, height: start.height };
      } else if (session.handle === 'top') {
        const bottom = start.y + start.height;
        const y = Math.max(0, Math.min(bottom - PERSON_BOX_MIN_HEIGHT, start.y + dy));
        box = { x: start.x, y, width: start.width, height: bottom - y };
      } else { // 'bottom'
        const height = Math.max(PERSON_BOX_MIN_HEIGHT, Math.min(1 - start.y, start.height + dy));
        box = { x: start.x, y: start.y, width: start.width, height };
      }

      session.pendingBox = box;
      const style = imageBoxToContainerStyle(box, session.containerRect, state.currentImageNaturalW, state.currentImageNaturalH);
      const boxEl = document.getElementById('person-box');
      if (boxEl) {
        boxEl.style.left = style.leftPct + '%';
        boxEl.style.top = style.topPct + '%';
        boxEl.style.width = style.widthPct + '%';
        boxEl.style.height = style.heightPct + '%';
      }
    }

    function onPersonBoxDragEnd() {
      document.removeEventListener('pointermove', onPersonBoxDragMove);
      const session = personBoxDragSession;
      personBoxDragSession = null;
      if (!session) return;
      state.currentImagePersonBox = session.pendingBox || session.startBox;
      render();
    }

    // Show toast
    // One persistent status toast for multi-second steps (analyzing, Studio
    // Finish). Same look as showToast but stays until hideStatusToast() - driven
    // from render()'s tail so it tracks state, not scattered call sites.
    let statusToastEl = null;

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      // Sit above the persistent status toast, if one is showing, so they don't overlap.
      if (statusToastEl) toast.style.bottom = '84px';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // Toast with an "Undo" action - stays 5s, or until Undo is clicked.
    function showUndoToast(message, onUndo) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      if (statusToastEl) toast.style.bottom = '84px';
      const label = document.createElement('span');
      label.textContent = message;
      const btn = document.createElement('button');
      btn.className = 'toast__action';
      btn.textContent = 'Undo';
      toast.append(label, btn);
      document.body.appendChild(toast);
      const timer = setTimeout(() => toast.remove(), 5000);
      btn.onclick = () => { clearTimeout(timer); toast.remove(); onUndo(); };
    }

    function showStatusToast(message) {
      if (!statusToastEl) {
        statusToastEl = document.createElement('div');
        statusToastEl.className = 'toast toast--status';
        document.body.appendChild(statusToastEl);
      }
      if (statusToastEl.textContent !== message) statusToastEl.textContent = message;
    }
    function hideStatusToast() {
      if (statusToastEl) { statusToastEl.remove(); statusToastEl = null; }
    }

    // Save API key + settings
    function saveApiKey(geminiKey, styleInstructions) {
      state.geminiApiKey = (geminiKey || '').trim();
      localStorage.setItem('gemini-api-key', state.geminiApiKey);
      state.styleInstructions = (styleInstructions || '').trim();
      localStorage.setItem('gemini-style-instructions', state.styleInstructions);
      state.showSettings = false;
      showToast('API key saved');
      render();
    }

    // Estimate $ cost of one Gemini call from its usageMetadata, using GEMINI_PRICING.
    // Silently returns 0 if usage data or a price entry is missing, rather than throw -
    // cost tracking should never be the reason a real API call fails.
    function estimateGeminiCost(modelId, usageMetadata) {
      const rates = GEMINI_PRICING[modelId];
      if (!rates || !usageMetadata) return 0;
      const inputTokens = usageMetadata.promptTokenCount || 0;
      const outputTokens = usageMetadata.candidatesTokenCount || 0;
      return (inputTokens / 1e6) * rates.input + (outputTokens / 1e6) * rates.output;
    }

    // Cost totals are tiny (a couple numbers per bucket), so plain localStorage is
    // fine here - no need for the IndexedDB path outfit images use.
    const COST_TOTALS_KEY = 'gemini-cost-totals';

    function loadCostTotals() {
      const defaults = { detection: { calls: 0, cost: 0 }, studioFinish: { calls: 0, cost: 0 }, generate: { calls: 0, cost: 0 } };
      try {
        const stored = JSON.parse(localStorage.getItem(COST_TOTALS_KEY));
        // Merge over defaults rather than requiring every bucket to already be
        // present, so older saved totals (from before the "generate" bucket
        // existed) still load instead of getting reset to zero.
        if (stored && stored.detection && stored.studioFinish) return { ...defaults, ...stored };
      } catch (err) { /* fall through to defaults */ }
      return defaults;
    }

    function persistCostTotals() {
      localStorage.setItem(COST_TOTALS_KEY, JSON.stringify(state.costTotals));
    }

    // Add one call's cost to a running bucket (state.costTotals.detection or
    // .studioFinish) and persist it, so the display updates on the next render() and
    // keeps accumulating across reloads instead of resetting.
    function trackGeminiCost(bucket, modelId, usageMetadata) {
      const totals = state.costTotals[bucket];
      if (!totals) return;
      totals.calls += 1;
      totals.cost += estimateGeminiCost(modelId, usageMetadata);
      persistCostTotals();
    }

    // Call Gemini's image model. Pass `imagePart` ({ mimeType, data }, base64 data
    // without the "data:" prefix) to edit an existing image instead of generating fresh.
    // Returns a data: URL for the first image Gemini returns.
    async function callGeminiImage(prompt, imagePart, aspectRatio, options) {
      const skipStyleInstructions = options && options.skipStyleInstructions;
      const costBucket = options && options.costBucket;
      const fullPrompt = (state.styleInstructions && !skipStyleInstructions) ? `${state.styleInstructions}\n\n${prompt}` : prompt;
      const parts = [{ text: fullPrompt }];
      if (imagePart) parts.push({ inlineData: imagePart });

      const body = { contents: [{ parts }] };
      if (aspectRatio) body.generationConfig = { imageConfig: { aspectRatio } };

      // IMAGE_OTHER is a documented Gemini quirk - a vague "didn't produce an image"
      // result that's frequently transient rather than a real content decision
      // (unlike an actual safety/blocklist block, which won't change on retry).
      // Google's own docs recommend a small number of retries for exactly this case.
      const maxAttempts = 3;
      let lastErr;

      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        const response = await fetch(`${GEMINI_API_URL}?key=${encodeURIComponent(state.geminiApiKey)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await response.json();
        if (response.status === 429 || data.error?.status === 'RESOURCE_EXHAUSTED') {
          // Distinct from the IMAGE_OTHER retry loop below on purpose - retrying
          // a rate-limited/quota-exhausted request immediately would just hit
          // the same limit again, so this fails fast instead of burning the
          // remaining attempts.
          throw new Error('Gemini\'s rate limit (or your usage quota) was hit — wait a moment before trying again, or check your quota in Google AI Studio.');
        }
        if (data.error) {
          // Google's own message here ("Unable to show the generated image...
          // Try rephrasing the prompt.") is boilerplate aimed at their own UI,
          // not this app - swap in something that actually tells the user what
          // to do next.
          const rawMessage = data.error.message || 'Gemini API error';
          const isPromptFailure = /unable to show the generated image|could not generate the image/i.test(rawMessage);
          throw new Error(isPromptFailure
            ? 'Gemini couldn\'t generate an image for that prompt — try simplifying it or rephrasing what you\'re asking for, then try again.'
            : rawMessage);
        }

        const candidate = data.candidates?.[0];
        const imagePartOut = candidate?.content?.parts?.find(p => p.inlineData);
        if (imagePartOut) {
          if (costBucket) trackGeminiCost(costBucket, GEMINI_MODEL, data.usageMetadata);
          return debugRawImage(`data:${imagePartOut.inlineData.mimeType};base64,${imagePartOut.inlineData.data}`, costBucket || 'image');
        }

        // No image came back — log the full response so the real cause (safety
        // block, quota, model access, etc.) is visible, and surface what we can.
        console.error('Gemini returned no image:', data);
        const textOut = candidate?.content?.parts?.find(p => p.text)?.text;
        const blockReason = data.promptFeedback?.blockReason;
        const finishReason = candidate?.finishReason;
        const isIntermittentFailure = finishReason === 'IMAGE_OTHER' && !blockReason;
        const reason = textOut
          || (blockReason && `Blocked (${blockReason})`)
          || (finishReason && finishReason !== 'STOP' && `Stopped (${finishReason})`)
          || 'Gemini did not return an image — see console for the full response';
        lastErr = isIntermittentFailure && attempt === maxAttempts
          ? new Error('Gemini failed to produce an image after a few attempts (a known intermittent issue on Google\'s end, not a content block) — try again in a moment.')
          : new Error(reason);

        if (!isIntermittentFailure || attempt === maxAttempts) throw lastErr;
        await new Promise(r => setTimeout(r, 500 * attempt)); // brief backoff before retrying
      }
      throw lastErr;
    }

    // The Generate modal's choices — each shown as a single-select row of options
    // on one line: gender, style, season, background, and a color mode (with a
    // "custom" mode that reveals up to 3 hand-picked swatches).
    const GENERATE_GENDER_OPTIONS = [
      { value: 'men', label: 'Men' },
      { value: 'women', label: 'Women' }
    ];
    const GENERATE_STYLE_OPTIONS = [
      { value: 'playful', label: 'Playful' },
      { value: 'serious', label: 'Serious' },
      { value: 'casual', label: 'Casual' },
      { value: 'formal', label: 'Formal' }
    ];
    const GENERATE_SEASON_OPTIONS = [
      { value: 'winter', label: 'Winter' },
      { value: 'autumn', label: 'Autumn' },
      { value: 'summer', label: 'Summer' }
    ];
    const GENERATE_BACKGROUND_OPTIONS = [
      { value: 'outdoors', label: 'Outdoors' },
      { value: 'plain', label: 'Plain background' }
    ];
    const GENERATE_COLOR_MODE_OPTIONS = [
      { value: 'colorful', label: 'Colorful' },
      { value: 'medium', label: 'Medium' },
      { value: 'monochrome', label: 'Monochrome' },
      { value: 'custom', label: 'Custom' }
    ];
    const DEFAULT_CUSTOM_COLOR = '#3b82f6';

    function randomPick(options) {
      return options[Math.floor(Math.random() * options.length)].value;
    }

    // Pre-fill a suggested choice in any category that isn't picked yet, so the
    // modal never opens blank — the user always has a starting point to tweak.
    // Color mode is only ever auto-suggested as colorful/medium/monochrome —
    // "custom" requires the user to deliberately pick it.
    function suggestGenerateOptions() {
      if (!state.generateGender) state.generateGender = randomPick(GENERATE_GENDER_OPTIONS);
      if (!state.generateStyle) state.generateStyle = randomPick(GENERATE_STYLE_OPTIONS);
      if (!state.generateSeason) state.generateSeason = randomPick(GENERATE_SEASON_OPTIONS);
      if (!state.generateBackground) state.generateBackground = randomPick(GENERATE_BACKGROUND_OPTIONS);
      if (!state.generateColorMode) state.generateColorMode = randomPick(GENERATE_COLOR_MODE_OPTIONS.slice(0, 3));
      refreshGeneratePromptText();
    }

    function openGenerateModal() {
      suggestGenerateOptions();
      state.showGenerateModal = true;
      render();
    }

    function selectGenerateOption(category, value) {
      state[category] = value;
      refreshGeneratePromptText();
      render();
    }

    function selectGenerateColorMode(mode) {
      state.generateColorMode = mode;
      if (mode === 'custom' && !state.generateCustomColors.length) {
        state.generateCustomColors = [DEFAULT_CUSTOM_COLOR];
      }
      refreshGeneratePromptText();
      render();
    }

    function addCustomColor() {
      if (state.generateCustomColors.length < 3) {
        state.generateCustomColors.push(DEFAULT_CUSTOM_COLOR);
        refreshGeneratePromptText();
        render();
      }
    }

    function updateCustomColor(index, hex) {
      state.generateCustomColors[index] = hex;
      refreshGeneratePromptText();
      render();
    }

    function removeCustomColor(index) {
      state.generateCustomColors.splice(index, 1);
      refreshGeneratePromptText();
      render();
    }

    // While a native color-picker popup is open (from a custom-color swatch),
    // hide the modal and its dark backdrop entirely so the page behind is visible
    // and pickable — e.g. with the browser's eyedropper tool. This talks to the
    // DOM directly instead of going through state + render(), since re-rendering
    // would replace the focused <input type="color"> and close the picker.
    function hideGenerateModalChrome() {
      const chrome = document.getElementById('generate-modal-chrome');
      if (chrome) {
        chrome.style.opacity = '0';
        chrome.style.pointerEvents = 'none';
      }
    }

    function showGenerateModalChrome() {
      const chrome = document.getElementById('generate-modal-chrome');
      if (chrome) {
        chrome.style.opacity = '';
        chrome.style.pointerEvents = '';
      }
    }

    // The native <input type="color"> popup doesn't reliably offer a real
    // pick-from-screen eyedropper across browsers/OSes (and its cursor is out of
    // our control). Use the actual EyeDropper API instead — the browser takes
    // over the cursor for the whole screen while it's active, no CSS involved.
    async function pickCustomColorFromScreen(index) {
      if (!window.EyeDropper) {
        showToast('Eyedropper not supported in this browser — pick from the swatch instead');
        return;
      }
      // Hide the modal/backdrop while sampling so the eyedropper can pick colors
      // from whatever it was covering (e.g. the outfit image behind it).
      hideGenerateModalChrome();
      try {
        const result = await new EyeDropper().open();
        updateCustomColor(index, result.sRGBHex);
      } catch (err) {
        // User cancelled (e.g. pressed Escape) — nothing to do.
      } finally {
        showGenerateModalChrome();
      }
    }

    // Re-roll all category suggestions (color mode only among colorful/medium/monochrome).
    function randomizeGenerateOptions() {
      state.generateGender = randomPick(GENERATE_GENDER_OPTIONS);
      state.generateStyle = randomPick(GENERATE_STYLE_OPTIONS);
      state.generateSeason = randomPick(GENERATE_SEASON_OPTIONS);
      state.generateBackground = randomPick(GENERATE_BACKGROUND_OPTIONS);
      state.generateColorMode = randomPick(GENERATE_COLOR_MODE_OPTIONS.slice(0, 3));
      state.generateCustomColors = [];
      refreshGeneratePromptText();
      render();
    }

    // Fallback outfit pieces per color palette, used to compose the prompt preview.
    const RANDOM_OUTFIT_PIECES = {
      men: {
        winter: [
          'a wool overcoat, chunky turtleneck sweater, straight-leg trousers, and leather boots',
          'a puffer jacket, flannel shirt, dark jeans, and a beanie',
          'a long trench coat, cashmere scarf, tailored pants, and ankle boots',
          'a shearling jacket, ribbed sweater, corduroy pants, and combat boots'
        ],
        autumn: [
          'a suede jacket, cable-knit sweater, straight-leg chinos, and leather boots',
          'a plaid flannel shirt, denim jacket, corduroy pants, and desert boots',
          'a knit cardigan, turtleneck, wool trousers, and loafers',
          'an olive utility jacket, thermal henley, cargo pants, and hiking boots'
        ],
        summer: [
          'a linen shirt, tailored shorts, and canvas sneakers',
          'a short-sleeve button-up, chino shorts, and boat shoes',
          'a tank top, denim shorts, and slide sandals',
          'a linen shirt, linen trousers, and espadrilles'
        ]
      },
      women: {
        winter: [
          'a wool coat, chunky turtleneck sweater, wide-leg trousers, and leather boots',
          'a puffer jacket, ribbed knit sweater, skinny jeans, and a beanie',
          'a long wool coat, cashmere scarf, tailored trousers, and ankle boots',
          'a shearling jacket, ribbed sweater, corduroy pants, and combat boots'
        ],
        autumn: [
          'a suede jacket, cable-knit sweater, straight-leg trousers, and ankle boots',
          'a plaid flannel shirt, denim jacket, a corduroy skirt, and desert boots',
          'a knit cardigan, turtleneck, wide-leg trousers, and loafers',
          'an olive utility jacket, a thermal top, wide-leg cargo pants, and hiking boots'
        ],
        summer: [
          'a flowy sundress, a straw hat, and sandals',
          'a linen shirt, high-waisted shorts, and espadrilles',
          'a tank top, denim shorts, and slide sandals',
          'a wrap dress, sandals, and a sun hat'
        ]
      }
    };

    // Compose a description sentence from the current category picks — this is
    // what gets written into the prompt textarea so the user can see and tweak it.
    function buildGeneratePromptText() {
      if (!state.generateGender || !state.generateStyle || !state.generateSeason || !state.generateBackground || !state.generateColorMode) {
        return '';
      }
      if (state.generateColorMode === 'custom' && !state.generateCustomColors.length) {
        return '';
      }
      const pieces = RANDOM_OUTFIT_PIECES[state.generateGender][state.generateSeason];
      const outfitPieces = pieces[Math.floor(Math.random() * pieces.length)];
      const colorPhrase = state.generateColorMode === 'custom'
        ? `a color palette using ${state.generateCustomColors.join(', ')}`
        : state.generateColorMode === 'monochrome'
        ? `a monochrome color palette for the outfit itself (the clothing pieces in shades of a single color) — the photo as a whole should still be a normal full-color photograph, not black-and-white`
        : `a ${state.generateColorMode} color palette`;
      const backgroundPhrase = state.generateBackground === 'outdoors' ? 'an outdoor setting' : 'a plain, unobtrusive background';
      return `A ${state.generateStyle} outfit for ${state.generateGender}'s style, for ${state.generateSeason}, using ${colorPhrase}, shot against ${backgroundPhrase}: ${outfitPieces}.`;
    }

    // Re-fill the prompt textarea from the current picks whenever one changes, so
    // it's always an editable preview of what's about to be generated.
    function refreshGeneratePromptText() {
      const text = buildGeneratePromptText();
      if (text) state.generatePrompt = text;
    }

    // Generate one more variant image from the prompt textarea (auto-filled from
    // the picks above, but freely editable) and add it to the in-progress variants
    // list — the modal stays open so more can be generated.
    async function addGenerateVariant() {
      if (!state.generateGender || !state.generateStyle || !state.generateSeason || !state.generateBackground || !state.generateColorMode) {
        return showToast('Pick a gender, style, season, background, and colors first');
      }
      if (state.generateColorMode === 'custom' && !state.generateCustomColors.length) {
        return showToast('Pick at least one custom color');
      }
      if (!state.geminiApiKey) {
        state.showGenerateModal = false;
        state.showSettings = true;
        render();
        showToast('Add your Gemini API key in Settings first');
        return;
      }

      const description = state.generatePrompt.trim() || buildGeneratePromptText();
      const prompt = `${description} Full-length shot of a model wearing the outfit, with their face fully visible and not cropped out of frame. Frame the subject vertically centered, head to feet taking up about 80% of the image height.`;

      state.generating = true;
      render();

      try {
        const imageDataUrl = await callGeminiImage(prompt, null, '3:4', { costBucket: 'generate' });
        const compressed = await resizeImage(imageDataUrl);
        // Each variant slot keeps every edited version generated for it, so you
        // can flip between them instead of losing the original. suggestedEdits tracks
        // what "Suggest alternatives" has already proposed for this slot, so it doesn't repeat itself.
        state.generateVariants.push({ images: [compressed], selectedIndex: 0, suggestedEdits: [] });
      } catch (err) {
        console.error('Gemini generate error:', err);
        showToast('Image generation failed: ' + err.message);
      } finally {
        state.generating = false;
        render();
      }
    }

    function removeGenerateVariant(index) {
      state.generateVariants.splice(index, 1);
      if (state.editingVariantIndex === index) state.editingVariantIndex = null;
      render();
    }

    // Switch which generated version (original or a past edit) is the "active"
    // one for a variant slot — this is what gets used if that slot is finalized.
    function selectVariantVersion(variantIndex, versionIndex) {
      const variant = state.generateVariants[variantIndex];
      if (variant) variant.selectedIndex = versionIndex;
      render();
    }

    function toggleVariantEdit(index) {
      state.editingVariantIndex = state.editingVariantIndex === index ? null : index;
      state.variantEditPrompt = '';
      render();
    }

    // Scoped to one variant slot in the Generate modal: ask Gemini for one small,
    // concrete change to that variant's current image, avoiding anything already
    // suggested for this same slot.
    async function suggestVariantEditAlternative(index) {
      if (!state.geminiApiKey) {
        state.showSettings = true;
        render();
        showToast('Add your Gemini API key in Settings first');
        return;
      }

      const variant = state.generateVariants[index];
      if (!variant) return;
      const sourceImage = variant.images[variant.selectedIndex];
      const [header, base64] = sourceImage.split(',');
      const mimeType = (header.match(/data:(.*);base64/) || [])[1] || 'image/jpeg';
      const avoidPhrase = variant.suggestedEdits.length
        ? ` Do not repeat any of these previous suggestions, and give a genuinely different kind of change this time: ${variant.suggestedEdits.map(s => `"${s}"`).join('; ')}.`
        : '';

      state.variantSuggesting = true;
      render();

      try {
        const response = await fetch(`${GEMINI_SEARCH_API_URL}?key=${encodeURIComponent(state.geminiApiKey)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { inlineData: { mimeType, data: base64 } },
                {
                  text: `Suggest ONE small, concrete change to this outfit that would still look great - e.g. swapping one piece's color or material, adding or removing an accessory, or changing the fit of one item. Reply with a single short instruction sentence only, no preamble, no quotes, no list of options - just the instruction itself, e.g. "Change the jacket to dark green" or "Swap the sneakers for brown leather boots".${avoidPhrase}`
                }
              ]
            }]
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || 'Gemini API error');
        trackGeminiCost('generate', GEMINI_SEARCH_MODEL, data.usageMetadata);

        const suggestion = (data.candidates?.[0]?.content?.parts || [])
          .map(p => p.text).filter(Boolean).join(' ').trim().replace(/^["']|["']$/g, '');
        if (!suggestion) throw new Error('No suggestion returned');

        state.variantEditPrompt = suggestion;
        variant.suggestedEdits.push(suggestion);
      } catch (err) {
        console.error('Suggest variant edit error:', err);
        showToast('Could not get a suggestion: ' + err.message);
      } finally {
        state.variantSuggesting = false;
        render();
      }
    }

    // Edit a single variant's currently-selected image with Gemini, adding the
    // result as a new version of that same slot (never overwriting an existing one).
    async function applyVariantEdit(index) {
      const prompt = state.variantEditPrompt.trim();
      if (!prompt) return showToast('Describe the change you want');
      if (!state.geminiApiKey) {
        state.showSettings = true;
        render();
        showToast('Add your Gemini API key in Settings first');
        return;
      }

      const variant = state.generateVariants[index];
      if (!variant) return;
      const sourceImage = variant.images[variant.selectedIndex];
      const [header, base64] = sourceImage.split(',');
      const mimeType = (header.match(/data:(.*);base64/) || [])[1] || 'image/jpeg';

      state.variantEditing = true;
      render();

      try {
        const imageDataUrl = await callGeminiImage(prompt, { mimeType, data: base64 }, '3:4', { costBucket: 'generate' });
        const compressed = await resizeImage(imageDataUrl);
        variant.images.push(compressed);
        variant.selectedIndex = variant.images.length - 1;
        state.editingVariantIndex = null;
        state.variantEditPrompt = '';
      } catch (err) {
        console.error('Gemini edit error:', err);
        showToast('Edit failed: ' + err.message);
      } finally {
        state.variantEditing = false;
        render();
      }
    }

    function resetGenerateModalState() {
      state.showGenerateModal = false;
      state.generatePrompt = '';
      state.generateGender = null;
      state.generateStyle = null;
      state.generateSeason = null;
      state.generateBackground = null;
      state.generateColorMode = null;
      state.generateCustomColors = [];
      state.generateVariants = [];
      state.editingVariantIndex = null;
      state.variantEditPrompt = '';
      state.variantEditing = false;
    }

    function cancelGenerateModal() {
      animateModalClose(() => {
        resetGenerateModalState();
        render();
      });
    }

    // Done generating — add every kept variant's selected image straight to the
    // wardrobe (Gemini item detection per image, if configured) and go straight
